o-focus,.map-children,.quiz-feedback,.daily-advice,.plan-row{background:rgba(255,255,255,.06)}.quiz-option{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.15)}.plan-number{background:rgba(255,255,255,.1)}.course-progress,.chapter-progress{background:rgba(255,255,255,.13)}.course-progress i,.chapter-progress i{background:#deded9}}\n+.recent-history{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}.history-list{display:grid;gap:6px;margin-top:8px}.history-row{display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.3);font-size:12px;line-height:1.55}.history-row span,.history-row small{color:var(--muted)}.backup-panel{margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--sheen),rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.62);line-height:1.75}.backup-panel p{margin:5px 0 11px;color:var(--muted);font-size:13px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap}.backup-import{display:inline-flex;align-items:center;cursor:pointer}.backup-import input{display:none}

<script>
const COURSES=[
{name:"科目一",title:"基金基础知识与法律法规",subtitle:"先打地基：市场、基金、规则与职业责任",chapters:[
{title:"金融市场与资产管理",intro:"先从生活里的借钱、储蓄和投资开始。金融市场就是让资金提供者与需要资金者，通过股票、债券等金融工具建立交易关系的一套场所和规则。",units:[["钱为什么要经过市场","有人暂时不用钱，有人想借钱扩大生产。金融市场把两边连接起来，让资金有机会流向需要它的地方。市场还提供价格、交易和风险管理机制。"],["市场里的五个角色","主体是参与者；客体是交易的金融工具；价格表示交易条件；交易方式规定如何成交；中介帮助信息、交易和结算。看任何市场，都可以按这五问拆开。"],["股票、债券与基金","股票代表公司股权，债券是借款关系，基金份额代表投资者对基金财产享有的份额权益。三者都可交易，但权利、回报来源和风险承担不同。"],["资产管理是什么","资产管理是受人之托管理财产。客户提供资金，管理人依约制定策略并投资，托管等机构提供财产保管和监督服务。管理人要尽责，但投资结果不保证。"]],example:"个人买入一只基金，资金进入基金财产；基金管理人按约定买证券，托管人履行托管职责。这里同时出现投资者、基金份额、管理服务和金融市场。",trap:"金融工具是交易对象；金融资产是投资者持有的权利或资产。专业管理不等于保本，投资者仍承担产品约定范围内的风险。",q:"金融市场把哪两类人连接起来？基金管理人与托管人各自主要做什么？",a:"金融市场连接资金供给方与资金需求方。管理人负责投资管理，托管人依据法律和合同履行基金财产托管等职责，两者不能混为一职。",map:["资金供需","供给方把暂时闲置资金投入市场；需求方借入或发行证券获得资金。","金融工具","股票、债券等形成可交易的权利，价格反映交易条件。","市场服务","交易场所、中介、登记结算等让交易达成并记录权利变化。","资产管理","投资者委托专业机构管理财产；管理、托管、销售等职责分开。"]},
{title:"基金概述",intro:"有了市场和金融工具的概念，就能理解基金：许多投资者按规则把资金汇集起来，形成独立财产，再由专业机构依约投资。",units:[["基金是什么","基金不是管理人公司本身，而是一种集合投资和财产管理安排。投资者持有基金份额，基金资产与管理人自有财产相区分。"],["分类先看维度","公募/私募看募集方式；股票/债券/货币看主要投资对象；开放式/封闭式看份额能否按约定申赎。不同维度可同时描述同一只基金。"],["基金如何运行","产品设计、募集、成立、投资管理、份额登记、估值核算、信息披露、收益分配、清算终止，构成生命周期。不同机构在各环节分工。"],["谁参与其中","投资者提供资金并享有份额权利；管理人负责投资；托管人管基金财产；销售、登记、估值、审计等机构提供专业服务。"]],example:"投资者申购开放式基金取得份额；基金净值变化后，份额价值随之变化。投资者赎回时，按合同和规则换回资金，赎回并不保证盈利。",trap:"“基金”既可以指基金财产安排，也可以口语指基金产品。管理公司、基金产品和基金份额是三个不同对象。",q:"公募/私募、股票/债券、开放式/封闭式分别按什么维度分类？",a:"公募/私募按募集方式；股票/债券按投资对象；开放式/封闭式按运作方式和申赎安排。",map:["投资者出资","资金汇集后形成独立基金财产，投资者取得基金份额。","管理人投资","按基金合同和投资策略作投资决策并管理组合。","托管与服务","托管、登记、估值、销售等机构分别支撑财产安全和业务流程。","收益与风险","资产价格和现金流变化反映到净值，投资者按份额承担结果。"]},
{title:"法律法规体系和监管体系",intro:"基金活动涉及公众资金，必须回答三件事：谁制定规则、谁监督、机构如何把规则落实到业务。",units:[["规则有层次","法律、行政法规、部门规章及规范性文件、行业自律规则和机构内部制度，分别来自不同制定主体。遇到规则冲突，先识别效力层级和适用对象。"],["行政监管","中国证监会依法监管基金市场，关注准入、市场行为、信息披露和违规处置。监管措施有法定权限和程序。"],["行业自律","基金业协会、证券交易所等在各自职责范围内制定或执行自律规则。自律管理有行业规范作用，不等于行政许可或对产品收益背书。"],["落到机构流程","一项业务要经过规则识别、制度设计、岗位分工、执行留痕、检查整改。内部制度不能降低上位规则要求。"]],example:"机构想推出一种新业务：先核对法律与行政规则，再查监管和自律要求，之后由机构设计授权、审核、披露和留痕流程。",trap:"登记、备案或审核程序不表示监管机构认可产品投资价值，更不保证未来收益。",q:"行政监管、自律管理、机构内控分别由谁实施？",a:"行政监管由有法定职权的行政机关实施；自律管理由行业自律组织在职责范围内实施；内控由基金机构通过自身治理和流程落实。",map:["上位规则","法律与行政法规确定基本边界。","行政监管","监管机关监督市场主体并依法采取监管措施。","行业自律","协会、交易场所等通过自律规则规范会员和市场行为。","机构内控","把外部规则转成岗位、授权、审核、留痕和整改。"]},
{title:"基金市场参与主体及从业人员",intro:"一只基金背后有多家机构和许多岗位。理解谁对什么负责，是之后学习募集、投资、交易和服务的基础。",units:[["管理人","管理人设计产品、依法募集并承担投资运作和持续管理职责。管理人需要具备相应组织和专业能力，按产品文件履责。"],["托管人与服务机构","托管人按规定保管基金财产、开立账户并履行相关监督职责。登记、估值、销售、审计、法律和信息技术等服务机构负责约定服务。"],["外包不等于免责","管理人可委托专业机构完成部分服务，但仍应进行遴选、尽调、授权、监督和应急管理。服务合同不能把法定管理责任一并转走。"],["从业人员","从业人员遵守任职、执业、利益冲突、信息保密和廉洁要求。工作记录和授权边界有助于责任追溯。"]],example:"管理人委托外部服务商做份额登记。管理人仍需确认系统安全、权限适当、数据可核验，并在发生差错时启动纠正和报告。",trap:"托管人不是投资决策人；服务机构也不是管理人。判断责任时看法律规定、基金合同、服务协议和实际职责。",q:"把估值外包后，管理人还需要做什么？",a:"选择合格服务方、明确标准与授权、持续监督和复核，并对基金运作中依法应承担的管理责任继续负责。",map:["管理人","募集、投资决策、运作管理、持续披露。","托管人","保管基金财产并按规定履行托管与监督职责。","服务机构","销售、登记、估值、审计、法律、信息技术等专业支持。","从业人员","在授权内履职，保护信息、回避冲突、留痕并接受监督。"]},
{title:"基金活动的法规要求",intro:"规则会随着基金生命周期变化：募集时保护谁可以买，投资时约束怎么做，持有期间要求披露什么，终止时如何清算。",units:[["先辨认产品","公募基金、私募资产管理计划、私募基金在管理人、投资者、募集方式、投资范围和披露规则上有差别。先确定产品类型，再找适用规则。"],["募集与销售","募集和宣传应真实、准确揭示风险并遵守适当性要求。不得用保本、无风险或保证收益的话术误导投资者。私募募集还要遵守非公开募集和合格投资者规则。"],["投资运作与披露","投资应遵守合同、投资范围、公平交易、关联交易和资产隔离要求。信息披露要真实、准确、完整、及时，不得误导或遗漏重要事项。"],["反洗钱","机构要按适用规则识别客户、了解业务关系和交易目的、保存资料、监测异常交易并履行报告义务。客户情况变化时需要更新信息。"]],example:"销售人员在公开社交平台向所有人推介私募产品并说“稳赚”。问题不止一句宣传语：还涉及募集对象、募集方式、风险揭示和销售流程。",trap:"公募基金、私募基金、私募资产管理计划不是同一类别；不能把一套募集要求不加区分地套到所有产品。",q:"遇到基金募集或销售问题，为什么要先识别产品类型？",a:"不同产品对应不同管理主体、投资者范围、募集流程和披露规则。先确定产品，才能找到正确的法律与自律要求。",map:["产品识别","先辨认公募基金、私募基金或私募资产管理计划。","募集与适当性","识别投资者，匹配产品风险，按规定募集并揭示风险。","投资与交易","遵守合同、投资范围、公平交易和利益冲突要求。","披露与反洗钱","持续提供真实信息，识别客户并监测异常活动。"]},
{title:"合规管理、风险管理和内部控制",intro:"同一个事件可以同时有合规、风险和内控问题。三者相互配合，但回答的问题不同。",units:[["合规管理：能不能做","识别业务是否符合外部规则和内部制度；发现偏差后及时纠正、报告、跟踪整改。合规管理强调独立、持续和覆盖全流程。"],["风险管理：可能损失什么","识别市场、信用、流动性、操作、合规、声誉等风险，评估发生可能性和影响，再选择监测、限额、缓释或应急措施。"],["内部控制：怎样保证执行","通过治理、岗位分离、授权、复核、系统权限、记录和监督，降低错误、舞弊和失控概率。控制应嵌入实际业务。"],["形成闭环","业务部门负责一线识别，风险与合规部门提供监督和专业支持，管理层配置资源并推动整改，董事会承担治理层面的责任。"]],example:"基金资产不易变现却遇到大量赎回：流动性风险管理评估现金需求；内控明确决策、估值和复核岗位；合规检查处置是否符合合同和规则。",trap:"有制度文本不等于控制有效；风险管理也不是风险部门单独负责。",q:"大量赎回时，合规、风险管理、内部控制各问什么？",a:"合规问处置是否符合规则；风险管理问可能损失和应对方案；内控问谁能决策、谁复核、如何监测并留痕。",map:["识别规则","合规判断业务边界与义务。","识别不确定性","风险管理评估损失来源、可能性和影响。","设计控制","授权、分岗、复核、限额、系统和记录。","监督整改","监测偏差，报告问题，纠正并验证整改结果。"]},
{title:"基金职业道德规范",intro:"职业道德把抽象的“专业”变成具体选择：面对客户利益、未公开信息、同事要求和自身利益时应该怎么做。",units:[["六项规范","守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。它们分别对应规则、事实、能力、服务对象、岗位责任和信息保护。"],["利益冲突","识别自己、关联方、客户和基金之间可能冲突的利益；按制度申报、回避、限制或披露，不能用个人判断替代规定流程。"],["客户至上有边界","保护客户及基金份额持有人合法权益，不等于满足某个客户的一切要求，也不能牺牲其他持有人利益。"],["保密与披露","客户信息、商业秘密和未公开信息应受到保护。法律规定、监管要求或适当授权构成披露依据时，按程序提供必要信息。"]],example:"研究员收到未公开重大信息，同事让他私下发给某位客户。应停止传播并按内部程序报告；“帮客户”不能成为泄露信息的理由。",trap:"忠诚尽责不是盲从上级；客户至上不是给个别客户开后门。",q:"六项职业道德规范有哪些？客户要求获取未公开信息时，哪几项会起作用？",a:"六项为守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。拒绝违规传播涉及守法合规、诚实守信、客户至上和保守秘密等要求。",map:["面对规则","守法合规：遵守法律、监管、自律和机构制度。","面对事实","诚实守信：不欺骗、不误导、不侵占。","面对工作","专业审慎、忠诚尽责：胜任、谨慎、认真履职。","面对客户与信息","客户至上、保守秘密：保护合法权益并按程序使用信息。"]},
{title:"基金行业文化建设",intro:"文化不是墙上的标语。它会影响机构怎样设目标、给员工怎样的激励、怎样对待投资者和怎样处理风险。",units:[["中国特色金融文化","用“五要五不”理解：诚实守信、不逾越底线；以义取利、不唯利是图；稳健审慎、不急功近利；守正创新、不脱实向虚；依法合规、不胡作非为。"],["文化怎样落地","将价值观写入治理、业务制度、产品设计、销售话术、绩效考核、培训和责任追究。检查行为结果，而不只看培训签到。"],["诚信管理","依法依规采集、记录、使用、查询和维护诚信信息。诚信管理有程序和边界，涉及更正、使用权限和保存期限时要看现行规则。"],["长期结果","良好文化支持投资者保护、服务实体经济、风险防范和行业长期发展；短期销售激励若诱发误导，必须从考核与控制机制修正。"]],example:"销售机构奖金只看短期销量，员工开始淡化风险。解决不只是再培训，而要调整考核、审查材料、追踪投诉并明确责任。",trap:"创新不等于绕开监管；文化建设也不是替代法律制度。",q:"怎样判断一家机构把行业文化落实到了日常经营？",a:"看治理、激励、流程、销售、客户保护和问责是否与价值观一致，观察实际行为和整改结果，而不是只看口号。",map:["价值观","诚信、义利、稳健、守正、合规。","制度设计","治理、考核、产品、授权、培训和责任机制。","日常行为","销售、投资、信息使用、客户服务和风险处置。","文化结果","维护信任、保护投资者并促进长期稳健发展。"]}
]},
{name:"科目二",title:"证券投资基金基础知识",subtitle:"从资产与现金流，走到组合、交易和基金运营",chapters:[
{title:"证券投资基金概述",intro:"证券投资基金把投资者资金汇成组合来投资证券。先理解基金与股票、债券的差异，再认识一只基金从募集到清算的完整流程。",units:[["基金的基本关系","投资者买入份额，基金财产持有证券，管理人作投资决策，托管人和服务机构履行各自职责。基金投资者承担净值变化带来的风险。"],["基金的运作环节","募集、投资管理、托管、交易结算、登记、估值核算、信息披露、销售服务和清算彼此相连。任一环节的数据错误都可能影响投资者权益。"],["基金的特点","集合投资带来分散化和专业管理，但分散不等于无风险。基金的流动性、费用、信息披露和法律关系要看具体类型与合同。"],["发展与市场","基金业经历制度和产品演进，投资范围、投资者结构和服务技术持续变化；理解发展脉络有助于区分传统产品与新类型。"]],example:"一只股票基金拥有多只股票。某公司股票下跌会影响基金净值，但影响大小取决于持仓比例及其他资产的表现。",trap:"买基金不是存款，基金净值不承诺固定；基金管理人也不等于基金资产所有者。",q:"基金份额持有人最终承担什么？管理人主要做什么？",a:"持有人按份额享有基金权益并承担投资风险；管理人依基金合同开展投资管理和运作。",map:["投资者","认购或申购基金份额，承担相应投资风险。","基金财产","按法律和基金合同与管理人自有财产区分。","管理与服务","管理人决策；托管、登记、估值、交易结算提供支持。","净值与权益","资产价值和费用进入核算，形成份额净值及投资者权益。"]},
{title:"基金的类型",intro:"基金名称往往同时包含多个分类。要先问“按什么标准分”，再理解这只基金适合什么用途、承担什么风险。",units:[["按投资对象","股票基金、债券基金、货币市场基金、混合基金和基金中基金等，资产构成与主要风险来源不同。"],["按运作方式","开放式基金按规则办理申购赎回；封闭式基金在约定期限内份额相对固定，交易安排不同。开放式不等于随时无条件取款。"],["指数与主动管理","指数基金试图跟踪指数，主动基金由管理人依据策略选择资产。指数跟踪仍有跟踪误差，主动管理也不保证跑赢基准。"],["特殊类型","QDII涉及境外投资，公募REITs投资基础设施相关资产并按规则运作。识别名称后要进一步看合同、投资范围和风险揭示。"]],example:"一只开放式债券指数基金：开放式描述申赎安排，债券描述投资对象，指数描述管理方法。这三个标签回答不同问题。",trap:"不能把股票/债券分类和开放/封闭分类当成互斥选项。",q:"如何解读“开放式债券指数基金”这几个词？",a:"开放式说运作和申赎；债券说主要投资资产；指数说投资管理目标或方式。",map:["分类维度","投资对象、募集方式、运作方式、投资策略分别回答不同问题。","底层资产","股票、债券、货币工具、其他基金或基础设施相关资产。","管理方式","主动选择或跟踪指数，决定决策和偏差来源。","投资体验","流动性、费用、波动和风险取决于多维度组合。"]},
{title:"投资管理基础",intro:"投资决策离不开财务报表、时间价值和数据。先读懂企业提供的数字，再判断这些数字怎样转化为价值和风险。",units:[["三张报表","资产负债表看某一时点拥有什么、欠什么；利润表看一段期间的收入和费用；现金流量表看现金从哪里来、流到哪里去。利润不等于现金。"],["报表分析","用偿债、盈利、运营效率和成长指标观察企业。杜邦分析把净资产收益率拆成利润率、资产周转率和权益乘数，帮助追问回报来自哪里。"],["货币时间价值","今天的一元钱可以投资生息，因此通常比未来的一元更有价值。终值 FV=PV×(1+r)^n；折现现值 PV=FV/(1+r)^n。"],["统计描述","均值描述中心水平，方差和标准差描述离散程度；相关性描述变量共同变化程度。历史数据只能帮助分析，不保证未来重复。"]],example:"企业账面盈利但客户尚未付款，现金流可能不足。分析偿债能力时只看利润表就会漏掉现金回收和债务到期问题。",trap:"名义利率未扣通胀，实际购买力要看实际利率；相关性不是因果关系。",q:"利润、现金流和资产负债表各回答什么问题？",a:"利润表看期间经营成果；现金流量表看现金收支；资产负债表看特定时点的资产、负债和权益。",map:["报表输入","资产负债表、利润表、现金流量表。","指标变换","比率和杜邦分解帮助比较偿债、盈利、效率与杠杆。","时间换算","复利推终值，折现把未来现金流换算为现值。","统计判断","用均值、波动和相关性描述数据，但不把历史关系误作保证。"]},
{title:"权益投资",intro:"权益代表对企业的剩余索取权。理解股东权利、公司融资结构和估值方法，才能看懂股票价格背后的企业假设。",units:[["股本与资本结构","企业用债务和权益融资。债权人通常先于股东获得合同约定的偿付，普通股股东分享剩余收益并承担较高的不确定性。"],["普通股与优先股","普通股通常有表决和剩余索取权；优先股在分红或清算顺序上可能有优先安排，具体权利以发行文件和法律为准。"],["股票估值","相对估值用可比企业的市盈率、市净率或市销率等倍数估算；现金流折现法把未来现金流按风险折到今天。方法不同，依赖假设也不同。"],["估值不是精确答案","估值结果受增长、利润率、资本成本、可比样本和市场情绪影响。分析要说清假设，并用区间与敏感性分析呈现不确定性。"]],example:"两家机器人公司收入倍数不同，可能因为增长、毛利、订单质量、现金消耗或技术风险不同。不能仅因行业相同就照搬估值。",trap:"股价是市场成交价格，内在价值是基于假设的估算；两者可能不一致。",q:"DCF估值最关键的两类输入是什么？",a:"未来可归属投资者的现金流预测，以及反映时间价值和风险的折现率；预测期、终值等假设也会显著影响结果。",map:["企业融资","债务和权益构成资本来源，权利与风险不同。","股东权益","享有剩余利益，普通股、优先股条款可能不同。","估值输入","盈利、现金流、增长、风险、可比公司和资本成本。","估值输出","倍数法或折现法形成估值区间，再与市场价格和交易条件比较。"]},
{title:"固定收益投资",intro:"债券像一张有期限和现金流约定的借条。投资者要判断发行人能否偿付、利率变化如何影响价格，以及债券何时能变现。",units:[["债券和市场","债券发行人按约定支付利息并偿还本金。市场包括发行与交易环节，国债、金融债和公司信用债的发行人及风险不同。"],["价格与收益率","债券价格等于未来票息和本金现金流的现值。其他条件不变时，市场利率上升，旧债券价格通常下降；期限越长，价格对利率变化通常越敏感。"],["久期与凸性","久期近似衡量价格对收益率变动的敏感度；凸性修正大幅利率变化时的曲线效应。它们是估算工具，不是价格保证。"],["收益率曲线","不同期限债券的收益率连成曲线，反映市场对利率、通胀、经济和风险的预期，也受供需和政策影响。"]],example:"市场利率上升后，新债券票息更有吸引力，旧债券通常要降价才能与新债竞争。持有到期与中途卖出面对的价格风险不同。",trap:"票面利率不等于到期收益率；到期收益率也以按假设持有和现金流再投资等条件为基础。",q:"为什么利率上升通常会让既有固定利率债券价格下跌？",a:"新发行债券提供更高收益，旧债的固定现金流相对不够吸引，价格需要下降，使其预期收益率接近市场水平。",map:["债券现金流","票息与本金按合同支付，信用风险影响能否兑现。","贴现定价","利率变化改变未来现金流现值，形成价格波动。","敏感度工具","久期提供一阶近似，凸性补充曲率影响。","期限结构","收益率曲线汇总不同期限的利率和风险信息。"]},
{title:"衍生工具",intro:"衍生品的价值来自股票、利率、汇率或商品等基础资产。它可以对冲风险，也可能放大损失。",units:[["远期与期货","远期通常由交易双方定制条款，常在到期结算；期货是标准化合约，在交易场所集中交易并通过保证金和每日结算管理风险。"],["期权","期权买方支付权利金，获得未来按约定价格买入或卖出的权利；卖方承担相应履约义务。买方最大损失一般为权利金，卖方风险结构不同。"],["互换","双方交换约定现金流，例如固定利率与浮动利率现金流。互换可调整风险敞口，但有对手方、估值和流动性风险。"],["用衍生品的目的","套期保值降低已有敞口风险；投机主动承担风险争取收益；套利利用定价差异。必须先识别敞口、合约、保证金和极端情景。"]],example:"航空公司担心燃油涨价，可能用相关工具管理价格风险。若衍生品与实际采购价格并不完全相关，仍会留下基差风险。",trap:"“套保”不代表没有损失；保证金较小可能带来较大的名义敞口。",q:"期权买方和卖方最大的权利义务区别是什么？",a:"买方取得选择是否行权的权利并支付权利金；卖方收取权利金后承担在买方行权时履约的义务。",map:["基础资产","股价、利率、汇率、商品等驱动衍生品价值。","合约类型","远期、期货、期权、互换的权利义务和交易方式不同。","风险机制","保证金、每日结算、对手方和流动性影响损益。","使用目的","套保、投机或套利；匹配不充分会产生基差和模型风险。"]},
{title:"另类投资",intro:"另类投资常指传统股票、债券之外的资产或策略。不同资产的估值、流动性和风险来源更复杂。",units:[["大宗商品","商品价格受供需、库存、运输、天气和政策影响。投资方式可能是实物、期货或相关证券，各自有仓储、展期和跟踪风险。"],["不动产","租金、空置率、资本化率、融资成本和物业维护共同影响价值。不动产流动性较低，估值频率和交易成本也与证券不同。"],["对冲基金策略","可能使用做空、杠杆、衍生品和复杂策略。策略名称不能替代风险分析，应理解敞口、流动性、杠杆和对手方。"],["另类资产的组合价值","另类投资可能提供不同风险收益来源，但相关性会随市场状态变化。配置要看组合整体风险、透明度、费用和退出条件。"]],example:"某商业地产账面估值稳定，不代表投资者能在短期内按该估值出售。交易稀少时，真实变现价格和时间都不确定。",trap:"资产类别不同不必然意味着低相关或分散效果稳定。",q:"评估另类资产时，为什么要单独检查流动性？",a:"许多另类资产交易不频繁、估值依赖模型或市场样本有限，急需现金时可能无法及时按合理价格变现。",map:["资产来源","商品、不动产、非传统策略等提供不同收益驱动。","估值机制","依赖供需、现金流、模型和有限交易样本。","风险特征","流动性、杠杆、透明度、估值和对手方风险。","组合配置","检查相关性、退出条件、费用与组合承受能力。"]},
{title:"投资管理流程",intro:"投资管理不是先挑一只股票，而是从目标和约束出发，经过研究、组合构建、交易、监控和复盘。",units:[["投资目标与约束","明确收益目标、风险承受、期限、流动性需求、法规和产品合同限制。目标不清，后续基准和策略就无从判断。"],["业绩比较基准","基准是衡量策略和业绩的参照，应与投资范围和风险特征匹配。选得不合适会让业绩评价失真。"],["形成投资组合","研究形成预期和风险判断，投资决策转化为资产配置、证券选择和仓位安排，再通过交易落实。"],["持续监控","跟踪风险、偏离、流动性、投资限制和市场变化；必要时调整组合，并记录决策依据。"]],example:"一只以中证宽基为基准的基金若长期持有大量小盘股，比较业绩时要先判断策略和基准是否匹配，再解释收益差异。",trap:"业绩好坏不能只看收益数字，还要结合基准、风险、期限和策略。",q:"业绩比较基准的主要用途是什么？",a:"提供与策略相匹配的参照，帮助表达投资目标、分析偏离和评价业绩；它不是收益保证。",map:["目标与限制","收益目标、风险、期限、流动性、法规和合同约束。","研究与决策","宏观、行业和证券分析形成预期与仓位。","组合与交易","配置资产并通过交易执行投资决策。","监测与改进","对照基准、风险和限制进行监控、调整和复盘。"]},
{title:"投资组合管理",intro:"组合管理关心的不是单一证券“好不好”，而是多项资产放在一起后，整体收益和风险如何变化。",units:[["分散化","不同资产的收益不完全同步时，组合可降低部分非系统风险。若资产高度相关或共同受同一冲击，分散效果会减弱。"],["均值—方差思想","在给定预期收益下比较风险，或在给定风险下寻找较高预期收益。结果依赖收益、波动和相关性的估计。"],["CAPM与β","β描述证券对市场系统性波动的敏感程度。CAPM把预期收益与无风险利率、β和市场风险溢价联系起来，是模型而非收益承诺。"],["资产配置与再平衡","先决定股票、债券、现金等大类权重，再选择具体资产。价格变化导致权重漂移时，按策略再平衡使组合回到目标风险。"]],example:"持有十只科技股不一定分散，因为它们可能受同一行业和利率冲击。增加现金、债券或不同收益驱动资产，才可能改变组合风险来源。",trap:"持仓数量多不等于风险分散；相关性会变化，模型输入也有估计误差。",q:"为什么投资组合风险不等于各证券风险的简单平均？",a:"组合风险还取决于权重和资产之间的相关性；收益不同步可以互相抵消一部分波动。",map:["单项资产","预期收益、波动率和系统性风险β。","资产间关系","协方差与相关性决定风险如何叠加或抵消。","组合优化","权重把单项风险收益组合成整体风险收益。","资产配置","目标权重、风险预算与再平衡决定组合结构。"]},
{title:"投资交易管理",intro:"投资决策必须通过交易变成持仓。交易制度、订单、市场冲击和结算安排都会影响实际成本与最终结果。",units:[["交易场所","交易所市场和银行间市场的参与者、交易机制、报价和结算制度不同。先确认证券在哪里交易，才能理解交易流程。"],["订单和成交","买卖指令按价格、数量、时间和交易规则撮合。流动性不足时，实际成交价可能偏离预期。"],["交易成本","显性成本包括佣金、税费等；隐性成本包括价差、冲击成本和未成交机会成本。大额交易更容易影响市场价格。"],["融资融券与杠杆","借入资金或证券能放大敞口，也会带来利息、保证金、追缴和强制平仓风险。交易策略必须考虑极端情景。"]],example:"基金要买入一只成交稀少的股票，若一次下单过大，可能抬高成交价格。拆分订单能减少冲击，但会增加执行时间和未成交风险。",trap:"下单价格不等于最终成交价格；成交后仍有清算交收流程。",q:"什么是交易冲击成本？",a:"订单本身影响市场价格造成的成本，例如大额买单推高成交价格、卖单压低成交价格。",map:["交易场所","交易所或银行间市场，各有规则和参与者。","下单与撮合","价格、数量、时间和流动性决定成交过程。","交易成本","佣金税费、价差、市场冲击和未成交成本。","清算交收","确认债券或证券与资金义务并完成实际交付。"]},
{title:"投资风险管理",intro:"风险不是“价格会跌”这么简单。不同风险要用不同指标观察，也要配合限额、情景分析和处置流程。",units:[["常见风险","市场风险来自价格波动；信用风险来自对手方或发行人违约；流动性风险来自难以按合理价格变现；操作风险来自流程、人为或系统问题。"],["收益波动与β","标准差描述收益波动；β描述相对市场的系统性敏感度。指标都依赖数据窗口，不能概括所有风险。"],["最大回撤与VaR","最大回撤描述历史区间从高点到低点的最大跌幅；VaR在给定期间和置信水平下估计损失阈值，不能说明阈值外损失上限。"],["风险管理动作","识别、计量、监测、报告和控制构成闭环。压力测试用于观察极端但合理的情景，风险限额要和投资目标相匹配。"]],example:"VaR显示日损失阈值为某金额，不代表损失一定不会超过它；极端行情、模型假设失效时，实际损失可能更大。",trap:"风险指标是观察工具，不是风险本身，也不保证未来表现符合历史数据。",q:"VaR没有告诉管理人什么？",a:"它不告诉超过阈值后的最大损失，也不保证损失不会越过该阈值。",map:["风险源","市场、信用、流动性、操作、合规和声誉风险。","风险量化","波动率、β、回撤、VaR等从不同角度观察风险。","情景检查","压力测试和极端情景补充历史数据盲点。","控制闭环","限额、监测、报告、应急和整改。"]},
{title:"基金业绩评价",intro:"比较基金不能只看“赚了多少”。还要确认收益如何计算、承担了多少风险、和什么基准相比、收益由什么贡献。",units:[["收益率口径","简单收益率看期初期末变化；几何收益率体现复利；年化率把期间收益换算成年尺度，但短期年化容易夸大印象。"],["时间加权与资金加权","时间加权收益尽量剔除申赎时点影响，用来评价管理表现；资金加权收益受现金流时间与金额影响，更贴近投资者实际体验。"],["风险调整收益","夏普比率等指标把超额收益与波动风险联系起来。比较时要确认无风险利率、计算期间和风险指标一致。"],["收益归因","将组合收益拆为资产配置、证券选择、行业暴露等来源，帮助解释结果；模型归因依赖基准与分类，不能把统计结果当因果证明。"]],example:"两个投资者持有同一基金，因一个在高点申购、一个长期定投，实际收益不同。评价基金管理时要避免把申赎时机误归因于经理能力。",trap:"过去业绩不代表未来；不同期间、基准和计算方法下的数字不能直接横比。",q:"时间加权收益和资金加权收益分别适合看什么？",a:"时间加权收益较适合隔离申赎现金流后评价管理表现；资金加权收益体现投资者现金流时点对实际回报的影响。",map:["收益口径","简单、复利、年化和累计收益。","现金流影响","时间加权弱化资金进出时点，资金加权反映投资者现金流体验。","风险调整","夏普等指标把回报与波动或风险联系起来。","收益解释","归因拆分资产配置、证券选择等贡献并检查基准适配。"]},
{title:"基金的募集、交易与登记",intro:"投资者买入基金份额时，实际涉及申请、资金确认、份额计算和登记。理解净值与收费，才能看懂“付了多少钱、买到多少份”。",units:[["认购与申购","认购通常指募集期买入新基金，申购指基金成立后买入；具体时间、费率和确认规则看产品文件。"],["净值与份额","在典型前端收费简化情形下，净申购金额=申购金额−费用，申购份额=净申购金额÷确认日单位净值。真实计算按产品费率和规则处理。"],["赎回","赎回金额取决于赎回份额、确认日净值、赎回费用和适用规则。申请日与确认日可能不同，到账也有处理时间。"],["登记记录权利","登记机构记录份额持有、申赎、转托管等事项。登记数据是确认投资者权益的重要基础。"]],example:"投入1万元申购，不能直接用1万元除以净值忽略费用；应先根据产品公式处理费率，再计算份额。",trap:"交易申请时间、净值确认日和资金到账日不是同一概念。",q:"申购份额通常由哪三个因素共同决定？",a:"申购金额、适用费率或费用，以及用于确认的基金单位净值。",map:["申请","投资者提交认购、申购或赎回申请。","确认与费用","依据受理时间、合同规则和费率确认金额。","净值换算","申购金额换成份额，赎回份额换成资金。","登记","更新持有人份额及相关权利记录。"]},
{title:"基金的投资交易与结算",intro:"基金买卖证券后，交易成交并不代表所有证券和资金已立即交割。清算与结算把交易义务最终落实。",units:[["交易和结算是两步","交易撮合形成买卖关系；清算计算应收应付；结算完成证券和资金交收。不同市场的结算周期和参与机制有差异。"],["集中与双边机制","部分市场通过中央对手方集中清算，降低双边对手风险并进行净额结算；另一些交易按市场规则采用其他安排。"],["交收风险","资金不足、证券不足、操作错误或系统故障可能导致交收失败。基金需要对账、监测头寸并设应急流程。"],["跨境与特殊市场","跨境投资可能面对时区、货币、托管、税务和结算制度差异，应把这些成本和操作风险纳入决策。"]],example:"基金今天卖出证券，账面显示有应收款，但资金可能要按市场交收规则稍后到账。安排当日赎回支付时要考虑现金时点。",trap:"成交、清算和交收各自不同；不能把成交回报当成现金已到账。",q:"清算和结算分别做什么？",a:"清算计算交易双方应收应付；结算实际交付证券和资金。",map:["成交","撮合形成证券买卖关系。","清算","核算各方证券与资金的应收应付。","结算","按市场规则完成证券、资金交收。","对账与风控","确认账务一致，处理失败交收与流动性需求。"]},
{title:"基金估值、费用与会计核算",intro:"基金净值回答“基金财产扣除负债后值多少、每份值多少”。估值和会计核算把持仓、价格、收入、费用转成投资者看到的数字。",units:[["资产净值","基金资产净值=基金资产总值−基金负债。单位净值通常以资产净值除以基金份额总数计算，实际披露按产品和规则执行。"],["估值","可交易资产常参考市场价格；缺乏活跃市场时需依据适用估值原则和模型。估值要一致、审慎、可复核，并处理重大事件。"],["费用","管理费、托管费、销售服务费及交易费用等会减少基金财产或投资者收益。区分从基金资产计提的费用和投资者申赎时可能支付的费用。"],["会计核算与复核","交易、利息、分红、费用和份额变化进入账务记录；管理人、托管人及服务机构按职责核对，差错要及时更正和披露。"]],example:"持仓股票下跌、同时发生管理费用，基金净值通常都会受影响。不能把费用从基金净值之外忽略。",trap:"基金单位净值不是持仓中某一只证券的价格，也不直接表示未来收益。",q:"基金资产净值与单位净值有什么区别？",a:"资产净值是基金资产总值扣除负债后的总额；单位净值通常是资产净值除以基金份额总数。",map:["资产与负债","汇总持仓、现金、应收项目和负债。","公允估值","根据市场价格或适当估值方法确定资产价值。","费用与核算","记录投资收益、交易、费用、份额和负债。","净值披露","净资产除以份额形成单位净值，经过复核后披露。"]},
{title:"基金的利润分配与税收",intro:"基金利润来自投资收入和资产价格变化，扣除费用后形成可分配收益。分红改变现金与净值形态，不会凭空增加总财富。",units:[["利润来源","利息、股息、已实现买卖收益和未实现估值变化等共同影响基金利润，口径要以会计和基金合同规定为准。"],["现金分红与再投资","现金分红把部分资产以现金形式分给持有人；红利再投资把分红换成更多份额。除息后基金净值通常相应调整。"],["投资者体验","分红不等于额外收益。比较分红前后要把已收到现金和剩余份额价值合并考虑。"],["税收","基金、被投企业及投资者可能涉及不同税种和纳税义务。税务处理取决于产品类型、所得性质、持有人身份和现行政策。"]],example:"基金每份净值1.20元，按规则分红0.10元后，除息净值大致减少对应金额；持有人多了现金或再投资份额，不能只看净值跌了就认为亏损。",trap:"分红率高不表示投资收益高；具体税务结论应按现行法规和身份核对。",q:"基金分红为什么不会自动增加投资者总财富？",a:"分红来自基金资产的分配，资产减少通常反映在除息后的净值；要把现金与剩余份额一起看。",map:["利润形成","投资收入、已实现损益、估值变动和费用共同作用。","分配决定","按产品文件和规则确定可分配收益及分配方式。","投资者所得","现金分红或红利再投资，权益形式改变。","税务判断","按主体、所得类型、产品结构和现行政策判断。"]},
{title:"基金的信息披露",intro:"投资者不参与日常管理，必须依靠持续、可靠的信息了解产品。信息披露让市场看见资产、风险、费用和管理情况。",units:[["披露原则","信息应真实、准确、完整、及时、公平，不能通过选择性披露或模糊表述误导投资者。"],["定期与临时信息","定期报告按周期总结财务、投资和运作；重大事项可能触发临时披露。不同产品披露要求与频率有差别。"],["招募与产品资料","募集阶段文件说明投资目标、策略、费用、风险、申赎和当事人职责，投资者应理解产品，而不是只看收益图。"],["信息边界","内幕信息、客户隐私和未公开投资信息要保护。披露范围、对象、时点和渠道依规则和授权确定。"]],example:"基金重大持仓发生变化或净值出现异常时，投资者需要依据适用规则获取及时、可核验的披露，而不是听销售人员私下承诺。",trap:"披露了信息不代表投资者自动理解风险；披露也不是收益保证。",q:"基金信息披露最核心的作用是什么？",a:"帮助投资者和市场及时获得真实、可比较的基金运作、财务、风险和重大事项信息。",map:["披露内容","产品目标、策略、资产、财务、费用、风险和重大事项。","披露时点","募集前、定期报告和重大事项发生时按规则披露。","披露质量","真实、准确、完整、及时、公平并可核验。","信息保护","处理未公开信息和客户信息，避免泄露或选择性披露。"]},
{title:"基金销售基础知识",intro:"基金销售不只是把产品卖出去，还包括了解客户、说明产品、进行适当性匹配并持续提供服务。",units:[["客户了解","了解客户的投资目标、期限、资金用途、财务状况、风险承受能力和投资经验。问卷只是工具，不能代替沟通和必要核验。"],["产品理解","识别产品投资范围、波动、流动性、杠杆、费用和可能损失，不能只依据历史收益或产品名称判断风险。"],["适当性匹配","把客户情况与产品风险等级、投资期限和流动性需求进行匹配，说明匹配理由并充分揭示风险。"],["销售服务","材料、话术、渠道和记录应符合要求；跟进投诉、信息更新和客户服务，不能作保本或保证收益承诺。"]],example:"计划一年内支付学费的人，即使风险问卷分数较高，也可能不适合购买锁定期长、短期难变现的产品。",trap:"客户签了风险揭示书，不代表销售机构可以忽视适当性职责。",q:"为什么“客户风险测评通过”仍不能单独证明产品适合？",a:"适当性还需同时理解客户需求、产品风险和流动性，进行合理匹配、解释并留痕。",map:["了解客户","目标、期限、资金用途、经验、承受能力。","了解产品","收益来源、风险、费用、流动性、限制。","匹配与揭示","作出适当性判断并解释不匹配风险。","持续服务","记录销售过程、处理投诉并更新信息。"]}
]},
{name:"科目三",title:"私募股权投资基金基础知识",subtitle:"以一笔投资贯穿募、投、管、退与基金运营",chapters:[
{title:"股权投资基金概述",intro:"股权投资基金汇集投资者资金，投资非公开交易的企业股权，经过多年培育后以转让、上市或其他方式退出。先把整条资金流画出来。",units:[["基金投资什么","基金直接或间接投资企业股权或相关权益，常见目标包括成长、创业和并购机会。企业经营结果、融资能力和退出环境共同影响回报。"],["基本架构","投资者作为有限合伙人LP等提供资本；管理人负责管理；普通合伙人GP在合伙型基金中承担相应职责；基金是独立投资载体，被投企业接收投资。"],["募投管退","募集资金，筛选并投资项目，投后管理，择机退出，再按基金文件分配收益。这是股权基金理解各章节的主线。"],["参与主体与作用","投资者、管理人、托管和服务机构、被投企业、监管和自律主体各有权利义务。股权投资可支持创新和企业成长，但也伴随较长周期和较低流动性。"]],example:"政府作为LP出资，不等于政府直接持有每个项目股权。基金管理人仍按合同和治理机制作投资决策；政府投资基金也可能同时追求政策目标和财务可持续。",trap:"GP不等于基金；基金管理人与GP可能由同一主体或不同主体担任，具体分工看法律关系和合同。",q:"LP、GP、基金管理人、基金本身分别是什么？",a:"LP通常是有限合伙人和出资方；GP是普通合伙人并承担合伙协议约定职责；管理人负责专业管理；基金是汇集资金并进行投资的载体。四者可能存在关联但概念不同。",map:["投资者","LP等出资人承诺并按约缴付资金，享有基金权益。","基金载体","公司型、合伙型或契约型安排持有投资财产。","管理与治理","管理人负责管理；GP等按组织形式与协议承担职责。","企业与退出","资金投向企业股权，经过管理后转让、上市或清算退出。"]},
{title:"股权投资基金管理人",intro:"基金需要有人持续找项目、作判断、管风险并向投资者报告。管理人是基金专业管理责任的中心。",units:[["管理人职责","管理人依据登记业务类型、法律规则和基金合同开展募集、投资、投后、披露和清算等工作。不得只收管理费而不履行管理职责。"],["信义义务","核心是忠实和勤勉：以基金和投资者利益为出发点，审慎决策，避免利益冲突，不侵占或挪用基金财产。"],["专业化与持续经营","管理人要有匹配业务的人员、制度、资本和运营能力，按规则持续维护登记信息和业务条件。登记不是对投资能力或收益的背书。"],["内部治理","股东、实际控制人、管理层和从业人员应守住职责边界。授权、关联交易审查、投资决策和监督机制共同减少个人决策失控。"]],example:"管理人同时管理两只基金，某项目只能分给一只。应依据既定分配政策、公平对待和利益冲突程序处理，不能把好项目只留给关联方。",trap:"管理人承担管理责任，GP承担的法律和合同职责需按基金组织形式分别判断；二者不要仅凭称呼推断。",q:"什么是管理人的信义义务？",a:"受托管理时忠实于受托目的和基金投资者合法权益，并以专业、谨慎、勤勉态度履行职责、管理利益冲突。",map:["组织能力","人员、制度、业务和持续运营能力相匹配。","受托管理","按基金合同管理财产并履行管理职责。","信义义务","忠实、勤勉、谨慎、公平并妥善处理冲突。","内部治理","股东、管理层、投委会和监督机制相互制衡。"]},
{title:"股权投资基金产品",intro:"同样叫股权基金，组织形式、投资阶段、资金来源和管理方式可能不同。要按投资者权利和决策结构来辨认。",units:[["产品基本要素","投资范围、期限、规模、管理费、收益分配、投资者权利和退出机制应写入基金文件，决定实际风险收益。"],["公司、合伙与契约","公司型基金通过公司治理结构决策；合伙型基金由普通合伙人、有限合伙人按法律和协议分工；契约型基金依基金合同安排权利义务。"],["创投与并购基金","创投基金常投早期或成长企业并伴随较高失败风险；并购基金常通过控股、收购或重组改善企业价值。投资阶段和策略不同。"],["母基金、S基金、政府投资基金","母基金投资其他基金；S基金受让既有基金份额或组合权益；政府投资基金通过市场化方式支持政策目标并关注绩效。具体架构和规则各有要求。"]],example:"地方引导基金出资母基金，母基金再投资若干子基金，子基金投资企业。资金链上每层的管理人、费用、绩效和返投约定都要分别看。",trap:"产业基金描述政策或产业目标，私募股权基金描述募集和投资运作类别，两种称呼可能重叠，但不是同一分类维度。",q:"母基金与S基金分别主要做什么？",a:"母基金主要投资其他基金；S基金通常交易存量基金份额或相关资产，为原投资者提供流动性并让新投资者接续持有。",map:["基金条款","规模、期限、投资范围、费用、分配、退出。","法律组织形式","公司治理、合伙协议或契约分别安排权利义务。","投资策略","创业、成长、并购、母基金、S基金和政府投资基金。","收益与政策目标","财务收益与政策效果可并存，但决策、考核和披露需明确。"]},
{title:"股权投资基金的募集与设立",intro:"先有资金承诺，基金才能投资。私募募集必须识别合适投资者、充分披露风险、签署文件并按规则完成设立和备案。",units:[["谁可以投资","合格投资者标准和适当性要求用于保护投资者。机构应核实投资者身份、资产或收入等适用条件，不能只凭一张自我声明。具体标准以现行规则为准。"],["募集怎么做","通常经历募集准备、投资者沟通、风险揭示、适当性评估、签署基金文件、缴款和基金设立等环节。私募不得公开或变相公开募集。"],["基金合同","约定投资范围、期限、出资安排、费用、决策机构、关联交易、信息披露、收益分配和退出清算等事项。看合同要把“谁、何时、如何、违约后果”找全。"],["备案与登记","管理人登记、基金备案和募集行为各有规则，属于监管或自律程序的一部分，不表示产品保本或收益受认可。信息变化应按要求更新报送。"]],example:"朋友在朋友圈看到私募广告就转账，可能绕过风险测评、合格投资者核验和合同签署。规范募集应在适当流程中完成。",trap:"非公开募集不等于可以随意找熟人募资；“朋友介绍”不能替代适当性和募集程序。",q:"基金备案对投资者意味着什么，不意味着什么？",a:"备案表示按规定履行相应程序；不代表监管或协会对产品质量、管理人信用或投资收益作保证。",map:["投资者筛选","核验合格投资者条件和风险适配。","风险揭示","提供真实募集材料，说明策略、费用、期限和风险。","签约缴款","明确出资、权利义务、治理和收益分配。","设立备案","按产品类型完成设立、备案和持续信息报送。"]},
{title:"股权投资基金的投资",intro:"从看见项目到把钱投进去，中间需要筛选、尽调、估值、决策、谈判和交割。估值只是交易的一部分，不是一个公式直接给出真价。",units:[["投资流程","项目来源、初步筛选、立项、尽职调查、估值分析、投资决策、协议谈判、满足交割条件和付款。不同项目的先后安排可能调整。"],["尽职调查","商业、财务、法律、税务、技术和团队尽调相互补充。目标是验证关键事实、找出风险和判断投资假设，不是保证项目未来成功。"],["估值方法","可比公司/交易倍数、现金流折现、资产基础法和退出反推等方法有不同适用情形。早期企业数据少，估值更依赖里程碑、市场空间和情景假设。"],["交易条款与结构","投资金额、投前/投后估值、股权比例、优先权、反稀释、回购、交割条件和治理权利共同塑造交易。每条款都需看触发条件和实际效力。"]],example:"投前估值1亿元，投资5000万元，简化且无其他股本调整时投后估值1.5亿元，新投资者持股约5000万÷1.5亿元=33.3%。若1亿元是投后估值，则持股约50%。",trap:"投资协议签署不等于已经交割；先决条件、审批、付款和股权登记可能还未完成。优先清算权等条款的结果还要结合协议和适用法律。",q:"DD、IC分别是什么？估值为何不能只看一个倍数？",a:"DD是尽职调查（Due Diligence）；IC常指投资委员会（Investment Committee）。估值倍数依赖可比对象和企业差异，需结合增长、利润质量、风险、条款和现金流假设判断。",map:["项目筛选","行业、团队、产品、市场、融资需求和退出可能性。","尽调验证","商业、财务、法律、税务、技术与团队信息。","估值与风险","方法、假设、情景、敏感性和股权稀释。","决策与交割","IC审批、谈判条款、满足先决条件、付款和登记。"]},
{title:"股权投资基金的投后管理",intro:"投资款付出后，基金要持续了解企业变化。投后管理既管基金自身风险，也可能通过资源和治理帮助企业发展。",units:[["基金层面管理","跟踪出资、投资限制、估值、现金流、投资者报告和组合风险，确保基金合同与管理流程持续执行。"],["项目监测","跟踪收入、现金消耗、订单、产品里程碑、融资、团队变化、法律合规和重大风险。用指标发现偏离，但指标不能替代实地了解。"],["治理与决策","董事席位、观察员、重大事项同意权等要按交易文件行使。基金应避免越权经营，也要及时应对约定的重大事项。"],["增值服务","协助招聘、战略、客户、融资、治理和并购资源。服务应贴合企业需要，不能把基金管理责任转嫁给企业。"]],example:"被投企业研发延期且现金跑道缩短。管理人应更新预测、评估追加融资与退出选项，和企业沟通里程碑并按协议处理，而不是只等下一份年报。",trap:"投后管理不是保证企业成功，也不是基金可以不受约束地经营被投企业。",q:"投后管理最重要的两条线是什么？",a:"持续监测基金和项目风险，以及在治理边界内为企业提供适当支持、推动价值提升。",map:["基金监测","现金、估值、期限、合同义务和组合暴露。","企业监测","经营指标、现金跑道、团队、产品和合规。","治理机制","依据投资协议行使信息权、参与权和保护性权利。","价值提升","资源协同、融资、战略、人才和风险处置。"]},
{title:"股权投资基金的项目退出",intro:"退出是把被投资企业的权益变回基金可分配的现金或资产。先分清“退出的是什么”，再逐步学习上市、挂牌、转让、回购和清算。",sourceNote:"原教材 p.234–237 缺页涉及的上市、挂牌与股份转让退出内容，已依据基金业协会 2026 年度修订考纲、协会投教资料及全国股转系统规则补充。",units:[
["项目退出的含义与目的","项目退出是基金出售或处置其持有的被投资企业权益，收回投资并实现或确认投资结果。退出所得归入基金财产，再依据基金合同处理费用、分配和清算。它不同于投资者转让基金份额，也不等于基金整体清算。"],
["退出方式与选择逻辑","常见项目退出方式包括境内外上市后转让、全国股转系统挂牌转让、向第三方协议转让、并购、约定回购和清算。选择时要看企业阶段、交易条件、时间、可实现价格、法律限制和基金期限。"],
["境内外资本市场","境内公开市场包括沪深交易所不同板块和北京证券交易所，各有定位、上市标准与审核安排；境外市场也有各自发行上市规则。全国股转系统挂牌属于挂牌转让安排，不应直接说成交易所上市。"],
["境内首次公开发行与上市","企业通常要经过规范治理、财务与法律核查、中介机构尽调、申报审核或注册、发行定价、发行承销和挂牌交易等环节。不同板块要求不同；满足上市条件、完成发行和正式挂牌是相连但不同的步骤。"],
["境外上市的基本思路","企业可能由境内主体直接赴境外发行上市，也可能通过境外控股架构间接上市。具体架构会涉及境内备案或监管要求、境外市场规则、外汇、税务、数据及信息披露等事项，应按项目情况逐项核查。"],
["上市后股份转让退出","被投企业上市后，基金通常在满足限售、承诺、股东身份、减持比例与披露等要求后，通过交易所允许的方式出售股份。上市只提供了公开交易渠道，不代表所持股份立即可售，也不保证成交价格或退出收益。"],
["全国股转系统挂牌退出","企业申请股票公开转让并挂牌，要满足适用规则并经过主办券商推荐、申请审核和信息披露等程序。挂牌后，股东依系统规则转让股份；挂牌与沪深交易所上市的市场定位、交易制度和流动性不能混为一谈。"],
["向第三方转让或并购退出","基金可以将股权协议转让给其他投资者，也可能通过企业整体出售、并购等交易实现退出。通常要核实受让方、定价依据、优先购买权、内部审批、合同交割和股权变更登记。"],
["回购退出","基金可依据投资协议约定，在约定条件触发时要求企业、创始人或其他义务人回购股权。回购权是一项合同安排，不是保本保证；能否实现还取决于条款效力、义务人履约能力和执行程序。"],
["清算退出","被投资企业解散或破产时，通过处置资产、清偿债务并分配剩余财产收回投资。清算通常要确认清算事由和主体、通知债权人、核实资产负债、依法清偿并形成清算报告；股东只能按法定顺序取得剩余财产。"]
],scenes:[
"基金持有一家企业20%的股权。企业经营成熟后，基金卖出所持股权，资金回到基金账户，再按基金合同分配。这是项目层面的退出；投资者转让基金份额则是另一层关系。",
"一家企业上市计划延后，基金期限却接近。管理人要比较并购、向第三方转让、合同回购和继续持有的可行性，不能只因“上市估值高”就把IPO当成唯一出口。",
"一家科技企业准备融资，顾问比较沪深不同板块、北交所和境外市场。每个市场的定位和要求不同；企业不能仅挑名称听起来合适的板块。",
"企业准备境内IPO：先规范治理、梳理历史沿革和财务信息，再由中介核查并按板块规则申报；审核注册、公开发行、正式上市后还要处理股份限售和减持。",
"创始人考虑境外上市架构。基金不能只看挂牌地点，还要核对架构路径、境内监管程序、境外市场义务以及股东将来如何减持。",
"基金持有的IPO前股份已经上市，但承诺的锁定期尚未结束。即使股票有公开报价，基金也要先确认所持股份是否可出售及适用的减持规则。",
"一家成长型企业暂未选择交易所上市，考虑申请全国股转系统挂牌。挂牌后股份转让仍要按该系统规则操作，市场流动性和交易方式也与交易所不同。",
"另一家机构愿意受让基金持有的股权。双方先核价、核对优先购买权和审批要求，再签协议、满足交割条件并办理股权变更。",
"投资协议约定公司在特定条件下回购股权，但触发时公司现金紧张。基金需要评估义务人偿付能力和执行路径，不能把回购条款当成确定回款。",
"被投企业经营失败并进入清算。清算人先依法处理资产与债务，只有清偿后剩余财产才可能分给股东，基金再依自身合同向投资者分配。"
],example:"基金持有企业股份，企业计划上市但目前股份受限售承诺约束。管理人需要比较上市后减持、第三方转让、并购或合同回购等路径，并核对每条路径的审批、期限、交易价格和交割条件，再把实际回款纳入基金分配。",trap:"项目退出、投资者转让基金份额、基金整体清算是三个不同层次；IPO、上市和卖出股份也不是同一步骤。回购承诺不等于保本，挂牌也不等于交易所上市。",q:"项目退出、企业上市和投资者退出基金有什么区别？",a:"项目退出是基金变现被投企业权益；企业上市是企业股票获得相应市场的挂牌交易资格；投资者退出基金是投资者转让或处置其基金份额。三个环节的主体、对象和规则不同。",map:[
"退出对象","卖出被投企业权益，回款进入基金财产；不要与基金份额转让或基金清算混淆。",
"退出选择","比较上市、挂牌、第三方转让、并购、回购和清算的时间、价格、限制及可执行性。",
"境内外市场","区分沪深及北交所不同板块、境外市场和全国股转系统挂牌的定位与规则。",
"境内IPO","规范治理与核查 → 申报审核或注册 → 发行承销 → 挂牌交易。",
"境外上市","辨认直接或间接架构，核对境内外监管、备案、披露、外汇与税务要求。",
"上市后减持","先看股份来源、限售承诺、股东身份和减持规则，再安排出售与信息披露。",
"挂牌转让","主办券商推荐 → 申请审核 → 挂牌披露 → 按系统规则转让股份。",
"第三方转让与并购","核对受让方与交易价格 → 审批和优先权 → 签约交割 → 股权登记。",
"回购","确认触发条件和义务人 → 评估履约能力 → 执行合同与支付安排。",
"清算","确认清算事由 → 处置资产并通知债权人 → 清偿债务 → 分配剩余财产。"
]},
{title:"股权投资基金治理",intro:"基金治理回答谁作决定、谁监督、投资者怎样获得信息以及利益冲突如何处理。好的治理减少单方控制和信息不对称。",units:[["治理主体","投资者、管理人、GP、投委会、托管人和咨询委员会可能承担不同职责。具体权力来源于法律、组织形式和基金文件。"],["治理原则","利益一致、公平对待投资者、专业审慎、信息透明，并适当考虑其他利益相关者。原则需要通过制度和流程落地。"],["决策与授权","设置投资决策、关联交易、利益冲突、估值、重大事项和清算机制，明确谁提议、谁审批、谁执行、谁复核。"],["公平与透明","同一基金投资者应按适用文件和规则获得公平待遇；重大信息应及时按约定披露，不能选择性偏袒特定投资者。"]],example:"管理人拟与关联方交易，应识别关联关系、评估公平性、履行审批和披露程序，并保留依据，不能仅因“项目不错”跳过治理流程。",trap:"投委会通过不自动替代合同约定的投资者同意、监管审批或交割条件。",q:"基金治理为什么要关注公平对待和信息透明？",a:"投资者通常不直接管理项目，公平机制减少利益冲突，透明信息帮助投资者监督并理解基金风险。",map:["权利边界","合同、法律与组织形式决定各方权限。","决策机制","投委会、投资者会议和重大事项审批。","冲突管理","关联交易、基金间分配和利益冲突审查。","监督与披露","托管、审计、信息报告、投诉与问责。"]},
{title:"股权投资基金的运营管理",intro:"基金运作不止投资和退出。账户、估值、现金流、税务、收益分配、信息报告和争议解决共同支撑基金全生命周期。",units:[["账户、登记与托管","登记记录投资者权益和出资变化；托管按约履行财产保管、账户及监督职责。具体托管要求依基金类型和规则判断。"],["估值与绩效指标","IRR考虑现金流时点；DPI=累计已分配金额÷累计实缴资本；RVPI反映未退出投资相对实缴资本的剩余价值；TVPI=DPI+RVPI。指标要结合基金阶段解读。"],["收益分配","先按合同处理费用、返还出资、优先收益和业绩报酬等顺序。瀑布分配条款需明确计算口径、门槛、追补和回拨机制。"],["清算、披露与争议","基金到期或触发解散后进行资产处置、债务清偿和剩余财产分配。持续报告、税务处理及争议解决方式依合同和现行规则执行。"]],example:"基金只退出了部分项目，DPI可能较低而RVPI仍较高；TVPI把已分配和估算剩余价值合并。未退出估值不是现金回款。",trap:"IRR会受现金流时间影响，倍数指标不体现时间；DPI、RVPI、TVPI也不能单独评价投资质量。",q:"DPI、RVPI、TVPI分别反映什么？",a:"DPI反映已经分配回来的金额相对于实缴资本；RVPI反映尚未退出资产的估值；TVPI通常为DPI与RVPI之和，代表已实现与未实现价值合计。",map:["运营底座","账户、登记、托管、财务记录和合规流程。","估值与表现","IRR看时间加权现金流，DPI/RVPI/TVPI区分已实现与未实现。","分配与税务","按合同水位、顺序、税务主体和所得类型计算。","退出清算","报告、解决争议、清偿债务并分配剩余财产。"]}
]}
];
COURSES[2].chapters[3].units[0][1]="按现行规则，合格投资者须有相应风险识别和承担能力，投资单只基金通常不低于100万元；机构净资产一般不低于1000万元；个人金融资产一般不低于300万元，或最近三年个人年均收入不低于50万元。法律还规定若干视同合格的投资者类别。适用例外、产品类型和规则变化需以现行正式规定为准。";

const TERMS=[
["货币","货币是被普遍接受的支付和计价工具，也可用于储藏价值。把钱存下、借出或用于投资，会进入不同的金融关系。","你用 100 元买日用品是在支付；把暂时不用的钱存入银行，则把资金交给金融体系安排。"],
["资金","在金融学习里，资金通常指可以用于消费、生产、借贷或投资的货币资源。资金会从暂时有余的一方流向当前需要的一方。","家庭有暂时闲置的储蓄，企业有扩建厂房的资金需求，两者之间可以通过金融体系建立联系。"],
["金融市场","资金供给方与需求方通过金融工具融通资金、形成交易价格并管理风险的一套场所、规则和关系。它既包括交易场所，也包括场外交易和支撑交易的制度。","企业发行债券筹钱，投资者买入债券；之后投资者之间还可以转让债券。"],
["直接融资","资金需求者通过发行股票、债券等金融工具，直接向投资者取得资金；金融中介仍可能提供承销、交易等服务。","公司发行债券，投资者认购，募集资金按约定进入公司。"],
["间接融资","资金通过银行等金融中介在供给方和需求方之间转移。中介先吸收存款或其他资金，再按规则向借款人提供资金。","储户把钱存入银行，企业向银行贷款；储户通常不直接成为企业的债权人。"],
["金融工具","金融工具是约定权利和义务、可以形成金融交易的合同或凭证，例如存款、贷款、股票、债券和基金份额。","债券写明谁借款、何时付息还本；股票代表股东权益，权利结构不同。"],
["金融资产","金融资产是持有人拥有的现金、金融工具或由合同形成的收款等权利。某项资产对一方是金融资产，对另一方常对应负债或权益。","你持有的债券是金融资产；发行债券的企业则承担按约偿付的义务。"],
["证券","证券是证明或设定财产权利等权益的凭证。股票和债券是常见证券，但证券并不等于所有金融工具。","银行存款属于金融关系和金融资产，但日常所说的证券通常指股票、债券等可交易凭证。"],
["股票","股票是公司发行的权益凭证，持有人依法和依公司章程享有相应股东权利，并承担股价波动等风险。股票不承诺固定还本或收益。","公司盈利和市场预期变化可能影响股价；股东也可能通过分红获得回报，但分红并非固定保证。"],
["债券","债券是发行人按约定向债券持有人偿还本金、支付利息或其他约定现金流的债务凭证。回报能否兑现取决于条款和发行人的偿付能力。","你借钱给企业并取得债券，企业按合同付息还本；如果信用变差，债券价格可能下跌。"],
["一级市场","一级市场是金融工具发行、募集资金的环节，发行人或基金在这里向投资者募集资金。","企业首次发行股票募集资金，资金进入发行人；基金募集成立也属于发行募集过程。"],
["二级市场","二级市场是已发行金融工具在投资者之间转让交易的市场。通常买卖双方互换持有者，交易款不直接成为发行人的新增融资。","投资者在交易所买入另一位投资者卖出的股票，成交价由市场交易形成。"],
["基金","基金是一种按规则汇集或受托管理财产、并依约进行投资的安排或产品。基金产品、基金管理公司和投资者持有的基金份额是不同概念。","买入基金份额后，你持有的是基金合同约定的权利，不是基金管理公司股权。"],
["基金财产","基金财产是依法律和基金合同归集、独立核算并用于基金运作的财产。它与管理人、托管人等机构的自有财产相区分。","基金持有的股票和银行存款属于该基金财产，不是管理公司可以拿去支付自身开支的钱。"],
["基金份额","基金份额是投资者持有基金权益的凭证，具体权利、费用和运作方式由法律及基金文件规定。份额数量不等于固定金额，价值会随基金资产变化。","你持有 100 份基金，单位净值从 1 元变为 1.05 元时，份额对应的资产价值也随之变化，费用等因素另计。"],
["基金净值","基金净值是基金资产扣除负债后的价值。单位净值通常等于基金净资产除以基金份额总数，是了解每份基金账面价值的重要指标。","如果基金净资产为 100 万元、总份额为 100 万份，简化计算的单位净值为每份 1 元。"],
["资产管理","资产管理是受托机构按约定替客户或基金管理财产、作出投资安排并承担相应职责的服务。专业管理不等于保证本金或收益。","投资者把钱投入基金，由管理人按照基金合同投资；盈亏仍会反映到基金财产和份额价值。"],
["基金管理人","基金管理人按照法律和基金文件募集、投资运作和管理基金，并承担相应受托职责。它负责投资管理，不等同于基金财产所有人。","管理人决定基金组合如何投资；投资决策应符合产品文件和适用规则。"],
["基金托管人","基金托管人依法律和基金文件履行基金财产保管、账户、核算或监督等职责。托管职责与管理人的投资决策职责不同。","托管人按规定保管、核对基金财产；通常不替管理人挑选股票。"],
["投资者","投资者是提供资金、购买或持有金融产品并承担相应投资结果的人或机构。投资者享有产品文件和法律规定的权利，也需要了解风险。","基金投资者可以查阅规定披露的信息、按约定申赎，也要承担基金净值波动。"],
["公募与私募","公募和私募主要描述募集方式及适用的规则框架。公募面向公众公开募集；私募以非公开方式向符合要求的投资者募集，不能公开宣传招揽。","同样投资股票的两只基金，募集对象和披露要求可能不同，不能只凭投资方向判断规则。"],
["开放式与封闭式","这是基金运作和份额申赎安排的分类。开放式基金通常按约定开放日办理申购、赎回；封闭式基金在约定期限内通常不办理日常申赎，份额可能通过市场交易。","开放式基金可能按合同每日开放；封闭式基金的投资者若要提前退出，可能需要在交易市场转让份额。"],
["申购","申购是投资者按基金规则申请买入基金份额的行为。受理申请、确认份额和资金到账有不同时间点，实际以产品文件及业务规则为准。","今天提交申购申请，不一定按提交瞬间的净值确认；要看申请时间、确认日和费用规则。"],
["赎回","赎回是投资者按基金规则申请卖回或注销所持基金份额并取得相应款项的行为。到账时间、费用、开放安排和限制以产品文件为准。","提交赎回后，通常还要经过确认和结算，到账金额会受到净值和费用影响。"],
["收益与风险","收益是投资带来的收入或价值变化；风险表示结果存在不确定性及可能损失。通常不能只看预期收益而忽略发生损失的可能与幅度。","两只产品预期收益相近，波动、流动性和本金损失可能性不同，不能据收益数字单独判断。"],
["流动性","流动性描述资产能否较快地以接近合理价值转换为现金，或产品能否按约定满足支付需求。流动性强弱会随市场环境变化。","交易活跃的股票通常较易出售；未上市公司的股权可能要等待多年才能退出。"],
["分散投资","分散投资是把资金配置到多个资产、行业或风险来源中，降低单一因素造成的影响；它不能消除整体市场风险，也不能保证盈利。","持有多家不同行业公司的股票，通常比只持有一家更不容易被单一公司事件左右。"],
["利率","利率是借用资金的价格，也用于把未来现金流换算成今天价值。市场利率变化会影响借款成本、债券估值和其他资产价格。","市场利率上升时，旧有固定票息债券相对吸引力可能下降，其价格通常承压。"],
["估值","估值是依据资产、现金流、可比交易或其他方法，对价值作出的判断。估值结果取决于方法、假设和信息，不一定等于实际可成交价格。","未上市公司股权的账面估值可能很高，但真正退出时仍要看买方、交易条件和市场环境。"],
["LP","Limited Partner，有限合伙人。其权利义务由法律和合伙协议确定，通常以认缴出资额为限承担合伙企业债务责任。","LP通常是基金的出资方之一，按协议缴资、获取信息并分享投资结果，不负责日常执行全部事务。"],
["GP","General Partner，普通合伙人。在有限合伙基金中通常负责执行合伙事务；其责任和权限依法律及合伙协议确定。GP是合伙人身份，不等于基金产品本身。","一个机构可以担任某只基金的 GP，但这家机构与基金及基金财产仍是不同主体。"],
["投前/投后估值","投前估值是本轮新资金进入前对企业股权价值的约定或测算；投后估值是本轮投资后口径。简化情形下，投后估值=投前估值+本轮新增投资。","投前 900 万元、本轮投资 100 万元，简化投后估值为 1000 万元；新投资人对应比例约 10%，复杂条款会改变结果。"],
["DD","Due Diligence，尽职调查。投资方在决策前核查企业或交易的商业、财务、法律、税务、技术和团队等情况，识别问题与风险。","看中一家初创企业后，投资团队会核验收入数据、知识产权、合同、债务和核心人员情况。"],
["IC","Investment Committee，投资委员会。机构按内部治理和授权制度，由委员会审议投资、退出或其他重要事项。具体权限因机构制度而异。","尽调完成后，投资团队可能向 IC 汇报交易逻辑、估值、风险和拟定条件。"],
["IPO","Initial Public Offering，首次公开发行股票。发行是公司向公众发行股票的过程；股票上市是其后在交易场所挂牌交易的环节，两者相关但不是同一概念。","公司完成 IPO 并上市后，原股东股份的减持仍可能受锁定期和现行规则约束。"],
["IRR","Internal Rate of Return，内部收益率。它是让一组按时间发生的投资现金流净现值等于零的折现率，金额和回款时间都会影响结果。IRR不是实际年年赚到的收益率。","同样收回 2 倍本金，较早收到回款的项目 IRR 通常高于较晚收到回款的项目。"],
["DPI","Distributed to Paid-In，累计已分配金额除以累计实缴资本，侧重衡量已经返还给投资人的现金。","累计实缴 100 万元、累计分配 60 万元，DPI 为 0.6 倍；剩余未退出估值不计入分子。"],
["RVPI","Residual Value to Paid-In，未退出投资的剩余估值除以累计实缴资本。它依赖估值，尚未变现，不等同于已收到的钱。","累计实缴 100 万元、未退出项目估值 40 万元，RVPI 为 0.4 倍；估值可能上调或下调。"],
["TVPI","Total Value to Paid-In，总价值倍数，通常等于 DPI 加 RVPI，合计已分配金额和未退出投资的估值，再与累计实缴资本比较。","DPI 为 0.6 倍、RVPI 为 0.4 倍时，TVPI 为 1.0 倍；这不表示投资人已收回全部现金。"],
["久期","久期是衡量债券价格对利率变化敏感程度的工具之一，修正久期常用于估算小幅利率变化造成的价格百分比变化。久期不等同于债券剩余期限。","修正久期约 5 的债券，收益率上升 1 个百分点时，价格粗略可能下跌约 5%；实际还受凸性等影响。"],
["适当性","适当性要求经营机构了解客户、产品或服务的风险，并按规定进行匹配、告知和风险揭示。它帮助投资者理解是否适合，不代表产品没有风险。","面对风险承受能力较低的客户，销售人员应核实其情况并按要求提示产品风险，不能只追求成交。"],
["交割条件","交割条件是交易正式付款、股权转让或资产交付前必须满足的事项，具体由交易文件和适用规则约定。","股权投资协议可能约定完成审批、提交证明文件后，投资款才支付、股权才办理变更。"],
["返投","返投常指政府投资基金等依政策、基金文件或协议约定，在特定地域或产业形成一定投资带动的安排。具体比例、统计口径和认定方式要看现行文件。","一只地方引导基金可能约定部分资金投向当地企业，但要按协议口径核实，不能把它理解成企业自动获得补贴。"],
["四上企业","统计工作中对规模以上工业企业、有资质建筑业企业、限额以上批零住餐企业和规模以上服务业企业等类别的统称。入库标准按行业和当期统计制度判断。","企业是否属于“四上”统计类别与它是否是基金、是否获得投资是两回事，也不代表自动取得补贴资格。"]
];
const FORMULAS=[
["货币时间价值","FV=PV×(1+r)^n","PV是今天的金额，r是每期利率，n是期数。100元按年利率5%复利两年，FV=110.25元。"],
["折现现值","PV=FV÷(1+r)^n","把未来现金流换算到今天。期限越长或折现率越高，其他条件相同时现值越低。"],
["债券定价","P=Σ[CF_t÷(1+y)^t]","债券价格是未来票息和本金按市场收益率折现后的总和。市场收益率上升，旧债价格通常下跌。"],
["债券当期收益率","当期收益率=年票息÷债券当前价格","例如年票息5元、价格98元，当期收益率约5.10%；它不含到期偿还与价格变化的完整收益。"],
["修正久期近似","ΔP/P≈−D_mod×Δy","收益率上升通常使债券价格下跌。利率变动较大时还要考虑凸性，估算不等于精确成交价。"],
["CAPM","E(R_i)=R_f+β_i×[E(R_m)−R_f]","预期收益由无风险利率加上承担系统性市场风险所对应的风险溢价构成；它是模型，不是保证收益。"],
["β","β_i=Cov(R_i,R_m)÷Var(R_m)","β衡量资产收益对市场收益变化的历史敏感程度。数据期间和市场代理选择会影响估计。"],
["夏普比率","Sharpe=(R_p−R_f)÷σ_p","单位总波动对应的超额收益；比较时应统一期间、无风险利率和收益频率。"],
["最大回撤","回撤_t=(净值_t÷此前最高净值)−1","区间最大回撤取回撤序列的最低值，表示从前高跌到后续低点的最大幅度。"],
["基金单位净值","单位净值=(基金资产总值−基金负债)÷基金份额总数","申购赎回的份额或金额以适用确认日净值和合同费率计算。"],
["简化申购份额","净申购金额=申购金额−申购费用；份额=净申购金额÷确认净值","不同产品可能采用不同费率和金额口径；这张卡说明基础关系，不替代具体产品公式。"],
["时间加权收益","TWR=Π(1+r_i)−1","把外部现金流发生时段切开并连乘，尽量剔除投资者申赎时点对管理业绩的影响。"],
["年化复合收益","年化收益=(1+期间收益)^(1/年数)−1","必须说明观察期间；把很短期间年化会放大不确定性。"],
["IRR","Σ[CF_t÷(1+IRR)^t]=0","让一组投资现金流净现值为零的折现率。现金流时点与金额都会影响IRR。"],
["DPI / RVPI / TVPI","DPI=累计已分配÷累计实缴；RVPI=剩余估值÷累计实缴；TVPI=DPI+RVPI","DPI是已回款，RVPI是未退出估值，TVPI合计两者；未实现估值不是现金。"],
["投前与投后估值","投后估值=投前估值+新增投资；新股比例≈投资额÷投后估值","只适用于简化无其他股本调整的情形。条款、期权池、可转证券和多轮交割会改变结果。"]
];

let state=blankStudyState();try{state=Object.assign(state,JSON.parse(localStorage.getItem("fund-study-course-v2")||"{}"))}catch(e){}

function save(){persistLocalState()}
function setSyncBadge(text){const el=document.getElementById("syncBadge");if(el)el.textContent=text}

function current(){return COURSES[state.course].chapters[state.chapter]}
function refsView(){return '<section class="panel"><div class="eyebrow">术语工具箱 · 从金融基础到基金实务</div><h2>先把常见词听懂</h2><p class="lead">按“钱与市场 → 证券与基金 → 投资与风险 → 股权基金实务”整理。每个词都附带白话解释和一个例子；有不懂的词，也可以用左侧搜索直接定位。</p><div class="glossary">'+TERMS.map((t,i)=>'<div class="term" id="term-'+i+'"><b>'+esc(t[0])+'</b><p>'+esc(t[1])+'</p><small><strong>举个例子：</strong>'+esc(t[2]||"")+'</small></div>').join("")+'</div></section><section class="panel"><div class="eyebrow">计算入门卡</div><h2>先看懂公式里的每个量</h2><p class="lead">公式卡配合对应章节学习；先明确单位、期间和假设，再代入数字。模型结果是分析工具，不是未来收益承诺。</p><div class="formula-list">'+FORMULAS.map((f,i)=>'<div class="formula" id="formula-'+i+'"><b>'+esc(f[0])+'</b><code>'+esc(f[1])+'</code><p>'+esc(f[2])+'</p></div>').join("")+'</div></section><section class="panel"><div class="eyebrow">版本与资料来源</div><h2>课程依据</h2><p>主课程按中国证券投资基金业协会 2026 年度修订大纲安排，并综合 2025 年版三本统编教材整理。主体概念、计算、场景和易混点已经写入课程，不要求你边看书边猜概念。法律、监管和交易规则可能更新，涉及具体数字、期限、税务或上市减持时，课程优先解释逻辑，并提示以现行正式规则为准。</p><div class="source-list">'+SOURCES.map(s=>'<div class="source"><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a><div class="smallnote">'+esc(s[2])+'</div></div>').join("")+'</div><p class="smallnote">工作台整理自课程教材与官方规则资料；PDF 原件保留为补充查阅材料。</p></section>'}
function normalizeState(){
 const toIndex=(v,max,fallback)=>{const n=Number(v);return Number.isInteger(n)?Math.max(0,Math.min(max,n)):fallback};
 state.course=toIndex(state.course,COURSES.length-1,0);
 state.chapter=toIndex(state.chapter,COURSES[state.course].chapters.length-1,0);
 state.tab=["home","course","map","refs"].includes(state.tab)?state.tab:"course";
 state.seen=state.seen&&typeof state.seen==="object"?state.seen:{};
 state.donePoints=state.donePoints&&typeof state.donePoints==="object"?state.donePoints:{};
 state.quizAnswers=state.quizAnswers&&typeof state.quizAnswers==="object"?state.quizAnswers:{};
 state.studyRecords=Array.isArray(state.studyRecords)?state.studyRecords:[];
 state.reviewDates=state.reviewDates&&typeof state.reviewDates==="object"?state.reviewDates:{};
 state.studiedOn=state.studiedOn&&typeof state.studiedOn==="object"?state.studiedOn:{};
 state.dailyPlans=state.dailyPlans&&typeof state.dailyPlans==="object"?state.dailyPlans:{};
 state.point=Number.isInteger(state.point)&&state.point>=0&&state.point<current().units.length?state.point:null;
}
function chinaDate(){
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const v={};p.forEach(x=>{if(x.type!=="literal")v[x.type]=x.value});return v.year+"-"+v.month+"-"+v.day;
}
function shiftDate(date,days){const p=date.split("-").map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]+days));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function pointFromKey(key){const p=key.split(":").map(Number);if(p.length!==3||!COURSES[p[0]]||!COURSES[p[0]].chapters[p[1]]||!COURSES[p[0]].chapters[p[1]].units[p[2]])return null;return{key,course:p[0],chapter:p[1],point:p[2]}}
function ensureTodayPlan(){
 const today=chinaDate();if(Array.isArray(state.dailyPlans[today]))return state.dailyPlans[today];
 const studied=state.studiedOn[today]||{},items=[];
 Object.keys(state.reviewDates).filter(k=>state.reviewDates[k]<=today&&!studied[k]&&state.donePoints[k]).sort((a,b)=>state.reviewDates[a].localeCompare(state.reviewDates[b])).slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}));
 outer:for(let ci=0;ci<COURSES.length;ci++)for(let hi=0;hi<COURSES[ci].chapters.length;hi++)for(let pi=0;pi<COURSES[ci].chapters[hi].units.length;pi++){const k=pointKey(ci,hi,pi);if(!state.donePoints[k]&&!items.some(x=>x.key===k)){items.push({key:k,kind:"新学"});if(items.length>=3)break outer}}
 if(items.length===0){const upcoming=Object.keys(state.reviewDates).filter(k=>!studied[k]&&state.donePoints[k]).sort((a,b)=>state.reviewDates[a].localeCompare(state.reviewDates[b]));upcoming.slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}));if(items.length===0)Object.keys(state.donePoints).filter(k=>state.donePoints[k]).slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}))}
 state.dailyPlans[today]=items;
 const dates=Object.keys(state.dailyPlans).sort();dates.slice(0,Math.max(0,dates.length-60)).forEach(d=>delete state.dailyPlans[d]);
 save();return items;
}
function startPlanItem(key,kind){
 const p=pointFromKey(key);if(!p)return;
 state.course=p.course;state.chapter=p.chapter;state.point=p.point;state.tab="course";
 if(kind==="复习")delete state.quizAnswers[key];
 save();render();
}
function todayRecords(){const d=chinaDate();return state.studyRecords.filter(x=>x.date===d)}
function learningSuggestion(){
 const records=todayRecords(),wrong=records.filter(x=>!x.correct).length,plan=ensureTodayPlan(),studied=state.studiedOn[chinaDate()]||{},done=plan.filter(x=>studied[x.key]).length;
 if(!records.length)return"先从今天的复习项开始，再学新知识点。建议分两次完成，约 15–20 分钟。";
 if(wrong>=2&&wrong>=records.length/2)return"今天有几题需要再巩固。明天的计划会优先安排这些知识点，先重读含义，再重做选择题。";
 if(plan.length&&done===plan.length)return"今天的计划已经完成。建议停在这里，让新内容沉淀；到期复习会自动排进之后的计划。";
 return"按计划继续一个知识点即可。答题结果已保存，明天会接着安排新内容或到期复习。";
}
function recentStudyCount(){const cutoff=shiftDate(chinaDate(),-6),seen={};state.studyRecords.forEach(x=>{if(x.date>=cutoff)seen[x.date+":"+x.key]=true});return Object.keys(seen).length}
function dailyPlanView(){
 const today=chinaDate(),plan=ensureTodayPlan(),studied=state.studiedOn[today]||{},done=plan.filter(x=>studied[x.key]).length,records=todayRecords(),right=records.filter(x=>x.correct).length;
 const rows=plan.map((item,i)=>{const p=pointFromKey(item.key);if(!p)return"";const c=COURSES[p.course],chapter=c.chapters[p.chapter],u=chapter.units[p.point],complete=!!studied[item.key];return '<div class="plan-row"><span class="plan-number">'+String(i+1).padStart(2,"0")+'</span><div class="plan-copy"><span class="plan-kind">'+item.kind+'</span><b>'+esc(u[0])+'</b><small>'+esc(c.name)+' · '+esc(chapter.title)+'</small></div><button type="button" class="'+(complete?"secondary":"primary")+'" onclick="startPlanItem(&quot;'+item.key+'&quot;,&quot;'+item.kind+'&quot;)">'+(complete?"再看":"开始")+'</button></div>'}).join("");
 const history=state.studyRecords.slice(-5).reverse().map(r=>'<div class="history-row"><span>'+esc(r.date)+'</span><b>'+esc(r.title||"知识点")+'</b><small>'+esc(COURSES[r.course]?COURSES[r.course].name:"课程")+' · '+(r.correct?"答对":"建议复习")+'</small></div>').join("");
 return '<section class="daily-plan"><div class="daily-head"><div><div class="eyebrow">今日学习计划 · '+today+'</div><h3>今天学 '+plan.length+' 个知识点，约 15–20 分钟</h3></div><div class="daily-total">'+done+' / '+plan.length+'</div></div><div class="chapter-status"><span>今日计划进度</span><span>'+done+' / '+plan.length+' 项</span></div><div class="progressline large"><span style="width:'+(plan.length?Math.round(done/plan.length*100):0)+'%"></span></div><div class="plan-list">'+(rows||'<p class="smallnote">今天的计划已完成。系统会在到期时安排复习。</p>')+'</div><div class="daily-advice"><b>学习建议</b><p>'+learningSuggestion()+'</p><small>今天答题 '+records.length+' 次 · 正确 '+right+' 次 · 近 7 天学过 '+recentStudyCount()+' 个知识点</small></div><div class="recent-history"><b>最近学习记录</b>'+(history?'<div class="history-list">'+history+'</div>':'<p class="smallnote">完成一次知识点选择题后，学习记录会显示在这里。</p>')+'</div></section>';
}
function pointKey(ci,hi,pi){return ci+":"+hi+":"+pi}
function chapterStats(ci,hi){const units=COURSES[ci].chapters[hi].units||[],done=units.filter((_,pi)=>state.donePoints[pointKey(ci,hi,pi)]).length;return{done,total:units.length,pct:units.length?Math.round(done/units.length*100):0}}
function subjectStats(ci){let done=0,total=0,chaptersDone=0;COURSES[ci].chapters.forEach((_,hi)=>{const s=chapterStats(ci,hi);done+=s.done;total+=s.total;if(s.total&&s.done===s.total)chaptersDone++});return{done,total,chaptersDone,chapters:COURSES[ci].chapters.length,pct:total?Math.round(done/total*100):0}}
function mapPairs(c){const m=c.map||[],out=[];for(let i=0;i<m.length;i+=2)out.push([m[i],m[i+1]||""]);return out}
function goTab(t){state.tab=["home","course","map","refs"].includes(t)?t:"course";save();render()}
function chooseCourse(i){state.course=Math.max(0,Math.min(COURSES.length-1,Number(i)||0));state.chapter=0;state.point=null;state.tab="course";state.seen[state.course+":0"]=true;save();render()}
function chooseChapter(i){state.chapter=Math.max(0,Math.min(COURSES[state.course].chapters.length-1,Number(i)||0));state.point=null;state.tab="course";state.seen[state.course+":"+state.chapter]=true;save();render()}
function openPoint(i){state.point=Math.max(0,Math.min(current().units.length-1,Number(i)||0));state.tab="course";state.seen[state.course+":"+state.chapter]=true;save();render()}
function backToChapter(){state.point=null;state.tab="course";save();render()}
function nextPoint(){if(state.point!==null&&state.point<current().units.length-1){state.point++;save();render()}else backToChapter()}
function nextChapter(){state.point=null;if(state.chapter<COURSES[state.course].chapters.length-1)state.chapter++;else if(state.course<COURSES.length-1){state.course++;state.chapter=0}else state.chapter=0;state.tab="course";state.seen[state.course+":"+state.chapter]=true;save();render()}
function previousChapter(){state.point=null;if(state.chapter>0)state.chapter--;else if(state.course>0){state.course--;state.chapter=COURSES[state.course].chapters.length-1}state.tab="course";save();render()}
function renderSide(){
 document.querySelectorAll(".navtabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
 document.getElementById("courses").innerHTML=COURSES.map((c,i)=>{const s=subjectStats(i);return '<button type="button" class="coursebtn '+(state.course===i?"active":"")+'" onclick="chooseCourse('+i+')">'+esc(c.name)+'<small>'+esc(c.title)+'</small><span class="course-meta"><span>已学 '+s.done+'/'+s.total+' 点</span><span>'+s.pct+'%</span></span><span class="course-progress"><i style="width:'+s.pct+'%"></i></span></button>'}).join("");
 document.getElementById("chapters").innerHTML=COURSES[state.course].chapters.map((c,i)=>{const s=chapterStats(state.course,i),ix=[c.title,c.intro,c.example,c.trap,c.q,c.a].concat(c.units.flat(),c.map).join(" ").toLowerCase();return '<button type="button" class="chapterbtn '+(state.chapter===i?"active":"")+'" data-search="'+esc((i+1)+" "+ix)+'" onclick="chooseChapter('+i+')"><span class="num">'+String(i+1).padStart(2,"0")+'</span><span class="chapter-title">'+esc(c.title)+'</span><span class="chapter-meta">知识点 '+s.done+'/'+s.total+(s.pct===100?" · 已完成":"")+'</span><span class="chapter-progress"><i style="width:'+s.pct+'%"></i></span></button>'}).join("");
}
function filterChapters(){
 const q=document.getElementById("search").value.trim().toLowerCase(),results=document.getElementById("searchResults"),courseLabel=document.getElementById("courseLabel"),chapterLabel=document.getElementById("chapterLabel"),courses=document.getElementById("courses"),chapters=document.getElementById("chapters");
 if(!q){results.classList.add("hide");results.innerHTML="";courseLabel.classList.remove("hide");chapterLabel.classList.remove("hide");courses.classList.remove("hide");chapters.classList.remove("hide");return}
 courseLabel.classList.add("hide");chapterLabel.classList.add("hide");courses.classList.add("hide");chapters.classList.add("hide");results.classList.remove("hide");
 const hits=[];
 COURSES.forEach((course,ci)=>course.chapters.forEach((chapter,hi)=>{
  const chapterBody=[course.name,course.title,chapter.title,chapter.intro,chapter.example,chapter.trap,chapter.q,chapter.a,...(chapter.map||[])].join(" ").toLowerCase();
  if(chapterBody.includes(q))hits.push({title:chapter.title,meta:course.name+" · 第 "+(hi+1)+" 章",action:"jumpSearchChapter("+ci+","+hi+")"});
  (chapter.units||[]).forEach((u,pi)=>{const map=(chapter.map||[]).slice(pi*2,pi*2+2).join(" ");if([u[0],u[1],chapter.scenes&&chapter.scenes[pi],map].join(" ").toLowerCase().includes(q))hits.push({title:u[0],meta:course.name+" · "+chapter.title+" · 知识点",action:"jumpSearchPoint("+ci+","+hi+","+pi+")"})});
 }));
 TERMS.forEach((t,i)=>{if(t.join(" ").toLowerCase().includes(q))hits.push({title:t[0],meta:"术语解释",action:"jumpSearchTerm("+i+")"})});
 FORMULAS.forEach((f,i)=>{if(f.join(" ").toLowerCase().includes(q))hits.push({title:f[0],meta:"计算入门卡",action:"jumpSearchFormula("+i+")"})});
 const shown=hits.slice(0,24);results.innerHTML='<div class="search-summary">'+(hits.length?'找到 '+hits.length+' 条，显示前 '+shown.length+' 条':'没有找到相关内容；试试章节名、概念名或术语')+'</div>'+shown.map(h=>'<button type="button" class="search-result" onclick="'+h.action+'"><b>'+esc(h.title)+'</b><small>'+esc(h.meta)+' · 点击打开</small></button>').join("");
}
function jumpSearchChapter(ci,hi){state.course=ci;state.chapter=hi;state.point=null;state.tab="course";state.seen[ci+":"+hi]=true;save();render()}
function jumpSearchPoint(ci,hi,pi){state.course=ci;state.chapter=hi;state.point=pi;state.tab="course";state.seen[ci+":"+hi]=true;save();render()}
function jumpSearchTerm(i){state.tab="refs";save();render();setTimeout(()=>document.getElementById("term-"+i)?.scrollIntoView({behavior:"smooth",block:"center"}),30)}
function jumpSearchFormula(i){state.tab="refs";save();render();setTimeout(()=>document.getElementById("formula-"+i)?.scrollIntoView({behavior:"smooth",block:"center"}),30)}
function chapterView(){
 const c=current(),course=COURSES[state.course],s=chapterStats(state.course,state.chapter),units=c.units||[];
 const cards=units.map((u,i)=>'<button type="button" class="point-card" onclick="openPoint('+i+')"><span class="point-row"><b>知识点 '+(i+1)+' · '+esc(u[0])+'</b><span class="point-badge">'+(state.donePoints[pointKey(state.course,state.chapter,i)]?"已学":"进入学习")+'</span></span><p>'+esc(u[1])+'</p></button>').join("");
 return '<section class="panel chapter-head"><div><div class="eyebrow">'+esc(course.name)+' · 第 '+(state.chapter+1)+' 章 / '+course.chapters.length+' 章</div><h2>'+esc(c.title)+'</h2><p class="lead">'+esc(c.intro)+'</p>'+(c.sourceNote?'<p class="smallnote">'+esc(c.sourceNote)+'</p>':'')+'<div class="chapter-status"><span>本章知识点进度</span><span>'+s.done+' / '+s.total+' · '+s.pct+'%</span></div><div class="progressline large"><span style="width:'+s.pct+'%"></span></div></div><div><h3>本章知识点</h3><p class="smallnote">点开任一知识点，按“含义解释 → 场景重现 → 选择题巩固”完成学习。</p><div class="point-list">'+cards+'</div></div><div class="case"><b>本章场景预览</b><br>'+esc(c.example)+'</div><div class="actions"><button type="button" class="secondary" onclick="previousChapter()">上一章</button><button type="button" class="nextbtn" onclick="nextChapter()">'+(state.chapter===course.chapters.length-1?(state.course===COURSES.length-1?"回到第一章":"进入下一科"):"下一章")+' →</button></div></section>';
}
function quizOptions(c,pi){
 const units=c.units||[],pool=units.map((u,i)=>({text:u[1],correct:i===pi,index:i}));
 const a=[pool[pi],...pool.filter(x=>x.index!==pi).sort((x,y)=>Math.abs(x.index-pi)-Math.abs(y.index-pi)).slice(0,3)];
 let seed=(state.course+1)*7919+(state.chapter+1)*313+(pi+1)*97;
 for(let i=a.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function answerPoint(optionIndex){
 if(state.point===null)return;const key=pointKey(state.course,state.chapter,state.point);if(state.quizAnswers[key]!==undefined)return;
 const options=quizOptions(current(),state.point),picked=options[optionIndex];if(!picked)return;
 const today=chinaDate(),correct=!!picked.correct,u=current().units[state.point];
 state.quizAnswers[key]=optionIndex;state.donePoints[key]=true;state.reviewDates[key]=shiftDate(today,correct?3:1);
 state.studiedOn[today]=state.studiedOn[today]||{};state.studiedOn[today][key]=true;
 state.studyRecords.push({date:today,key,correct,course:state.course,chapter:state.chapter,point:state.point,title:u[0],at:new Date().toISOString()});
 if(state.studyRecords.length>2000)state.studyRecords=state.studyRecords.slice(-2000);
 save();render();
}
function exportProgress(){
 const blob=new Blob([JSON.stringify({format:"fund-workbench-backup-v1",exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="基金从业学习记录-"+chinaDate()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importProgress(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=function(){try{const data=JSON.parse(reader.result),saved=data.state||data;if(!saved||typeof saved!=="object"||!saved.donePoints||!saved.studyRecords)throw new Error("备份文件格式不正确");state=Object.assign({course:0,chapter:0,tab:"home",seen:{},donePoints:{},quizAnswers:{},studyRecords:[],reviewDates:{},studiedOn:{},dailyPlans:{}},saved);normalizeState();state.lastOpenDate=chinaDate();state.tab="home";ensureTodayPlan();save();render();alert("学习进度和记录已恢复。")}catch(e){alert("未能读取这份备份，请选择由工作台导出的 JSON 文件。")}};reader.readAsText(file);input.value="";
}
function pointView(){
 const c=current(),course=COURSES[state.course],i=state.point,u=c.units[i],s=chapterStats(state.course,state.chapter),key=pointKey(state.course,state.chapter,i),options=quizOptions(c,i),chosen=state.quizAnswers[key],pairs=mapPairs(c),branch=pairs[i]||[u[0],u[1]],scene=c.scenes&&c.scenes[i]?c.scenes[i]:c.example,answered=chosen!==undefined,correct=answered&&options[chosen]&&options[chosen].correct;
 const opts=options.map((o,j)=>'<button type="button" class="quiz-option'+(answered&&o.correct?" correct":"")+(answered&&j===chosen&&!o.correct?" incorrect":"")+'" '+(answered?"disabled":"")+' onclick="answerPoint('+j+')"><span class="quiz-letter">'+String.fromCharCode(65+j)+'</span><span>'+esc(o.text)+'</span></button>').join("");
 const feedback=answered?'<div class="quiz-feedback"><b>'+(correct?"答对了":"再看一遍这个定义")+'</b>'+esc(u[1])+(c.trap?'<p><b>容易混淆：</b>'+esc(c.trap)+'</p>':'')+'</div>':'<p class="smallnote">选完后会显示判断结果和解释；答错也可以继续学习。</p>';
 return '<section class="panel point-detail"><div><p class="breadcrumb">'+esc(course.name)+'　›　第 '+(state.chapter+1)+' 章 '+esc(c.title)+'　›　知识点 '+(i+1)+'</p><div class="eyebrow">含义解释 · 场景重现 · 选择题巩固</div><h2>'+esc(u[0])+'</h2><div class="chapter-status"><span>本章进度</span><span>'+s.done+' / '+s.total+' 个知识点</span></div><div class="progressline large"><span style="width:'+s.pct+'%"></span></div></div><article class="definition-card"><h3>① 含义解释</h3><p class="definition-text">'+esc(u[1])+'</p><div class="scenario-focus"><b>放在本章主线里：</b>'+esc(c.intro)+'</div></article><article class="scenario-card"><h3>② 场景重现</h3><p class="scenario-text">'+esc(scene)+'</p><div class="scenario-focus"><b>本知识点在场景中的观察角度：'+esc(branch[0])+'</b><br>'+esc(branch[1])+'</div></article><article class="quiz-card"><h3>③ 选择题巩固</h3><p>关于“'+esc(u[0])+'”，下列哪项理解最准确？</p><div class="quiz-options">'+opts+'</div>'+feedback+'</article><div class="detail-actions"><button type="button" class="secondary" onclick="backToChapter()">返回本章知识点</button><button type="button" class="nextbtn" onclick="nextPoint()">'+(i<c.units.length-1?"下一个知识点":"回到本章")+' →</button></div></section>';
}
function lessonView(){return state.point===null?chapterView():pointView()}
function mapView(){
 const c=current(),course=COURSES[state.course],pairs=mapPairs(c),units=c.units||[];
 const nodes=units.map((u,i)=>{const p=pairs[i]||[u[0],u[1]];return '<article class="map-point"><h3>'+esc(u[0])+'</h3><p>'+esc(u[1])+'</p><div class="map-children"><b>'+esc(p[0])+'</b><br>'+esc(p[1])+'</div><button type="button" class="map-link" onclick="openPoint('+i+')">打开这个知识点 →</button></article>'}).join("");
 return '<section class="panel"><div class="eyebrow">科目 → 章节 → 知识点 → 关键关系</div><h2>'+esc(c.title)+'｜思维导图</h2><p class="lead">每个分支都展开到知识点含义和它在本章中的位置；点“打开这个知识点”即可进入完整讲解、场景和选择题。</p><div class="maptree"><div class="maproot">'+esc(course.name)+' · '+esc(course.title)+'</div><div class="mapchapter">第 '+(state.chapter+1)+' 章 · '+esc(c.title)+'</div><div class="map-points">'+nodes+'</div></div><div class="actions"><button type="button" class="secondary" onclick="goTab(\'course\')">回到本章</button><button type="button" class="nextbtn" onclick="nextChapter()">沿学习顺序继续 →</button></div></section>';
}
function homeView(){
 const courseCards=COURSES.map((c,i)=>{const s=subjectStats(i);return '<article class="homecard"><div class="eyebrow">'+esc(c.name)+' · '+c.chapters.length+' 章</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.subtitle)+'</p><div class="chapter-status"><span>知识点进度</span><span>'+s.done+'/'+s.total+' · '+s.pct+'%</span></div><div class="progressline large"><span style="width:'+s.pct+'%"></span></div><button type="button" class="primary" onclick="chooseCourse('+i+')">进入科目 →</button></article>'}).join("");
 return '<section class="panel home-panel"><div class="eyebrow">选择学习科目</div><div class="homegrid">'+courseCards+'</div>'+dailyPlanView()+'<h3>学习方式</h3><p>按科目顺序学习：先进入章节查看全部知识点，再逐个学习含义解释、场景重现和选择题。进度与答题结果会自动保存。</p><div class="backup-panel"><b>学习档案与设备</b><p>登录后，学习计划、答题结果和进度会自动保存到云端；本机也会保留一份缓存。仍可导出备份作额外留存。</p><div class="backup-actions"><button type="button" class="secondary" onclick="exportProgress()">导出学习记录</button><label class="secondary backup-import">导入备份<input type="file" accept="application/json,.json" onchange="importProgress(this)"></label></div></div><div class="actions"><button type="button" class="secondary" onclick="goTab(\'map\')">看当前章节思维导图</button><button type="button" class="nextbtn" onclick="chooseCourse(0)">从第一科开始 →</button></div></section>';
}
function render(){
 renderSide();
 const m=document.getElementById("main");
 if(state.tab==="home")m.innerHTML=homeView();
 else if(state.tab==="course")m.innerHTML=lessonView();
 else if(state.tab==="map")m.innerHTML=mapView();
 else if(state.tab==="refs")m.innerHTML=refsView();
 const search=document.getElementById("search");if(search)search.value="";const results=document.getElementById("searchResults");if(results){results.innerHTML="";results.classList.add("hide")}document.getElementById("courseLabel").classList.remove("hide");document.getElementById("chapterLabel").classList.remove("hide");document.getElementById("courses").classList.remove("hide");document.getElementById("chapters").classList.remove("hide");
}
normalizeState();
const openDate=chinaDate();if(state.lastOpenDate!==openDate)state.tab="home";state.lastOpenDate=openDate;
state.seen[state.course+":"+state.chapter]=true;
ensureTodayPlan();
document.querySelector(".navtabs").addEventListener("click",function(e){const b=e.target.closest("[data-tab]");if(b)goTab(b.dataset.tab)});
save();
render();
setSyncBadge("进度自动保存在此浏览器");
</script></body></html>
