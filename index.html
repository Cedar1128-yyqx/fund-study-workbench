o-focus,.map-children,.quiz-feedback,.daily-advice,.plan-row{background:rgba(255,255,255,.06)}.quiz-option{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.15)}.plan-number{background:rgba(255,255,255,.1)}.course-progress,.chapter-progress{background:rgba(255,255,255,.13)}.course-progress i,.chapter-progress i{background:#deded9}}\n+.recent-history{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}.history-list{display:grid;gap:6px;margin-top:8px}.history-row{display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.3);font-size:12px;line-height:1.55}.history-row span,.history-row small{color:var(--muted)}.backup-panel{margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--sheen),rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.62);line-height:1.75}.backup-panel p{margin:5px 0 11px;color:var(--muted);font-size:13px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap}.backup-import{display:inline-flex;align-items:center;cursor:pointer}.backup-import input{display:none}

<script>
const COURSES=[
{name:"科目一",title:"基金基础知识与法律法规",subtitle:"先打地基：市场、基金、规则与职业责任",chapters:[
{title:"金融市场与资产管理",intro:"先从生活里的借钱、储蓄和投资开始。金融市场就是让资金提供者与需要资金者，通过股票、债券等金融工具建立交易关系的一套场所和规则。",units:[["钱为什么要经过市场","有人暂时不用钱，有人想借钱扩大生产。金融市场把两边连接起来，让资金有机会流向需要它的地方。市场还提供价格、交易和风险管理机制。"],["市场里的五个角色","主体是参与者；客体是交易的金融工具；价格表示交易条件；交易方式规定如何成交；中介帮助信息、交易和结算。看任何市场，都可以按这五问拆开。"],["股票、债券与基金","股票代表公司股权，债券是借款关系，基金份额代表投资者对基金财产享有的份额权益。三者都可交易，但权利、回报来源和风险承担不同。"],["资产管理是什么","资产管理是受人之托管理财产。客户提供资金，管理人依约制定策略并投资，托管等机构提供财产保管和监督服务。管理人要尽责，但投资结果不保证。"]],example:"个人买入一只基金，资金进入基金财产；基金管理人按约定买证券，托管人履行托管职责。这里同时出现投资者、基金份额、管理服务和金融市场。",trap:"金融工具是交易对象；金融资产是投资者持有的权利或资产。专业管理不等于保本，投资者仍承担产品约定范围内的风险。",q:"金融市场把哪两类人连接起来？基金管理人与托管人各自主要做什么？",a:"金融市场连接资金供给方与资金需求方。管理人负责投资管理，托管人依据法律和合同履行基金财产托管等职责，两者不能混为一职。",map:["资金供需","供给方把暂时闲置资金投入市场；需求方借入或发行证券获得资金。","金融工具","股票、债券等形成可交易的权利，价格反映交易条件。","市场服务","交易场所、中介、登记结算等让交易达成并记录权利变化。","资产管理","投资者委托专业机构管理财产；管理、托管、销售等职责分开。"]},
{title:"基金概述",intro:"有了市场和金融工具的概念，就能理解基金：许多投资者按规则把资金汇集起来，形成独立财产，再由专业机构依约投资。",units:[["基金是什么","基金不是管理人公司本身，而是一种集合投资和财产管理安排。投资者持有基金份额，基金资产与管理人自有财产相区分。"],["分类先看维度","公募/私募看募集方式；股票/债券/货币看主要投资对象；开放式/封闭式看份额能否按约定申赎。不同维度可同时描述同一只基金。"],["基金如何运行","产品设计、募集、成立、投资管理、份额登记、估值核算、信息披露、收益分配、清算终止，构成生命周期。不同机构在各环节分工。"],["谁参与其中","投资者提供资金并享有份额权利；管理人负责投资；托管人管基金财产；销售、登记、估值、审计等机构提供专业服务。"]],example:"投资者申购开放式基金取得份额；基金净值变化后，份额价值随之变化。投资者赎回时，按合同和规则换回资金，赎回并不保证盈利。",trap:"“基金”既可以指基金财产安排，也可以口语指基金产品。管理公司、基金产品和基金份额是三个不同对象。",q:"公募/私募、股票/债券、开放式/封闭式分别按什么维度分类？",a:"公募/私募按募集方式；股票/债券按投资对象；开放式/封闭式按运作方式和申赎安排。",map:["投资者出资","资金汇集后形成独立基金财产，投资者取得基金份额。","管理人投资","按基金合同和投资策略作投资决策并管理组合。","托管与服务","托管、登记、估值、销售等机构分别支撑财产安全和业务流程。","收益与风险","资产价格和现金流变化反映到净值，投资者按份额承担结果。"]},
{title:"法律法规体系和监管体系",intro:"基金活动涉及公众资金，必须回答三件事：谁制定规则、谁监督、机构如何把规则落实到业务。",units:[["规则有层次","法律、行政法规、部门规章及规范性文件、行业自律规则和机构内部制度，分别来自不同制定主体。遇到规则冲突，先识别效力层级和适用对象。"],["行政监管","中国证监会依法监管基金市场，关注准入、市场行为、信息披露和违规处置。监管措施有法定权限和程序。"],["行业自律","基金业协会、证券交易所等在各自职责范围内制定或执行自律规则。自律管理有行业规范作用，不等于行政许可或对产品收益背书。"],["落到机构流程","一项业务要经过规则识别、制度设计、岗位分工、执行留痕、检查整改。内部制度不能降低上位规则要求。"]],example:"机构想推出一种新业务：先核对法律与行政规则，再查监管和自律要求，之后由机构设计授权、审核、披露和留痕流程。",trap:"登记、备案或审核程序不表示监管机构认可产品投资价值，更不保证未来收益。",q:"行政监管、自律管理、机构内控分别由谁实施？",a:"行政监管由有法定职权的行政机关实施；自律管理由行业自律组织在职责范围内实施；内控由基金机构通过自身治理和流程落实。",map:["上位规则","法律与行政法规确定基本边界。","行政监管","监管机关监督市场主体并依法采取监管措施。","行业自律","协会、交易场所等通过自律规则规范会员和市场行为。","机构内控","把外部规则转成岗位、授权、审核、留痕和整改。"]},
{title:"基金市场参与主体及从业人员",intro:"一只基金背后有多家机构和许多岗位。理解谁对什么负责，是之后学习募集、投资、交易和服务的基础。",units:[["管理人","管理人设计产品、依法募集并承担投资运作和持续管理职责。管理人需要具备相应组织和专业能力，按产品文件履责。"],["托管人与服务机构","托管人按规定保管基金财产、开立账户并履行相关监督职责。登记、估值、销售、审计、法律和信息技术等服务机构负责约定服务。"],["外包不等于免责","管理人可委托专业机构完成部分服务，但仍应进行遴选、尽调、授权、监督和应急管理。服务合同不能把法定管理责任一并转走。"],["从业人员","从业人员遵守任职、执业、利益冲突、信息保密和廉洁要求。工作记录和授权边界有助于责任追溯。"]],example:"管理人委托外部服务商做份额登记。管理人仍需确认系统安全、权限适当、数据可核验，并在发生差错时启动纠正和报告。",trap:"托管人不是投资决策人；服务机构也不是管理人。判断责任时看法律规定、基金合同、服务协议和实际职责。",q:"把估值外包后，管理人还需要做什么？",a:"选择合格服务方、明确标准与授权、持续监督和复核，并对基金运作中依法应承担的管理责任继续负责。",map:["管理人","募集、投资决策、运作管理、持续披露。","托管人","保管基金财产并按规定履行托管与监督职责。","服务机构","销售、登记、估值、审计、法律、信息技术等专业支持。","从业人员","在授权内履职，保护信息、回避冲突、留痕并接受监督。"]},
{title:"基金活动的法规要求",intro:"规则会随着基金生命周期变化：募集时保护谁可以买，投资时约束怎么做，持有期间要求披露什么，终止时如何清算。",units:[["先辨认产品","公募基金、私募资产管理计划、私募基金在管理人、投资者、募集方式、投资范围和披露规则上有差别。先确定产品类型，再找适用规则。"],["募集与销售","募集和宣传应真实、准确揭示风险并遵守适当性要求。不得用保本、无风险或保证收益的话术误导投资者。私募募集还要遵守非公开募集和合格投资者规则。"],["投资运作与披露","投资应遵守合同、投资范围、公平交易、关联交易和资产隔离要求。信息披露要真实、准确、完整、及时，不得误导或遗漏重要事项。"],["反洗钱","机构要按适用规则识别客户、了解业务关系和交易目的、保存资料、监测异常交易并履行报告义务。客户情况变化时需要更新信息。"]],example:"销售人员在公开社交平台向所有人推介私募产品并说“稳赚”。问题不止一句宣传语：还涉及募集对象、募集方式、风险揭示和销售流程。",trap:"公募基金、私募基金、私募资产管理计划不是同一类别；不能把一套募集要求不加区分地套到所有产品。",q:"遇到基金募集或销售问题，为什么要先识别产品类型？",a:"不同产品对应不同管理主体、投资者范围、募集流程和披露规则。先确定产品，才能找到正确的法律与自律要求。",map:["产品识别","先辨认公募基金、私募基金或私募资产管理计划。","募集与适当性","识别投资者，匹配产品风险，按规定募集并揭示风险。","投资与交易","遵守合同、投资范围、公平交易和利益冲突要求。","披露与反洗钱","持续提供真实信息，识别客户并监测异常活动。"]},
{title:"合规管理、风险管理和内部控制",intro:"同一个事件可以同时有合规、风险和内控问题。三者相互配合，但回答的问题不同。",units:[["合规管理：能不能做","识别业务是否符合外部规则和内部制度；发现偏差后及时纠正、报告、跟踪整改。合规管理强调独立、持续和覆盖全流程。"],["风险管理：可能损失什么","识别市场、信用、流动性、操作、合规、声誉等风险，评估发生可能性和影响，再选择监测、限额、缓释或应急措施。"],["内部控制：怎样保证执行","通过治理、岗位分离、授权、复核、系统权限、记录和监督，降低错误、舞弊和失控概率。控制应嵌入实际业务。"],["形成闭环","业务部门负责一线识别，风险与合规部门提供监督和专业支持，管理层配置资源并推动整改，董事会承担治理层面的责任。"]],example:"基金资产不易变现却遇到大量赎回：流动性风险管理评估现金需求；内控明确决策、估值和复核岗位；合规检查处置是否符合合同和规则。",trap:"有制度文本不等于控制有效；风险管理也不是风险部门单独负责。",q:"大量赎回时，合规、风险管理、内部控制各问什么？",a:"合规问处置是否符合规则；风险管理问可能损失和应对方案；内控问谁能决策、谁复核、如何监测并留痕。",map:["识别规则","合规判断业务边界与义务。","识别不确定性","风险管理评估损失来源、可能性和影响。","设计控制","授权、分岗、复核、限额、系统和记录。","监督整改","监测偏差，报告问题，纠正并验证整改结果。"]},
{title:"基金职业道德规范",intro:"职业道德把抽象的“专业”变成具体选择：面对客户利益、未公开信息、同事要求和自身利益时应该怎么做。",units:[["六项规范","守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。它们分别对应规则、事实、能力、服务对象、岗位责任和信息保护。"],["利益冲突","识别自己、关联方、客户和基金之间可能冲突的利益；按制度申报、回避、限制或披露，不能用个人判断替代规定流程。"],["客户至上有边界","保护客户及基金份额持有人合法权益，不等于满足某个客户的一切要求，也不能牺牲其他持有人利益。"],["保密与披露","客户信息、商业秘密和未公开信息应受到保护。法律规定、监管要求或适当授权构成披露依据时，按程序提供必要信息。"]],example:"研究员收到未公开重大信息，同事让他私下发给某位客户。应停止传播并按内部程序报告；“帮客户”不能成为泄露信息的理由。",trap:"忠诚尽责不是盲从上级；客户至上不是给个别客户开后门。",q:"六项职业道德规范有哪些？客户要求获取未公开信息时，哪几项会起作用？",a:"六项为守法合规、诚实守信、专业审慎、客户至上、忠诚尽责、保守秘密。拒绝违规传播涉及守法合规、诚实守信、客户至上和保守秘密等要求。",map:["面对规则","守法合规：遵守法律、监管、自律和机构制度。","面对事实","诚实守信：不欺骗、不误导、不侵占。","面对工作","专业审慎、忠诚尽责：胜任、谨慎、认真履职。","面对客户与信息","客户至上、保守秘密：保护合法权益并按程序使用信息。"]},
{title:"基金行业文化建设",intro:"文化不是墙上的标语。它会影响机构怎样设目标、给员工怎样的激励、怎样对待投资者和怎样处理风险。",units:[["中国特色金融文化","用“五要五不”理解：诚实守信、不逾越底线；以义取利、不唯利是图；稳健审慎、不急功近利；守正创新、不脱实向虚；依法合规、不胡作非为。"],["文化怎样落地","将价值观写入治理、业务制度、产品设计、销售话术、绩效考核、培训和责任追究。检查行为结果，而不只看培训签到。"],["诚信管理","依法依规采集、记录、使用、查询和维护诚信信息。诚信管理有程序和边界，涉及更正、使用权限和保存期限时要看现行规则。"],["长期结果","良好文化支持投资者保护、服务实体经济、风险防范和行业长期发展；短期销售激励若诱发误导，必须从考核与控制机制修正。"]],example:"销售机构奖金只看短期销量，员工开始淡化风险。解决不只是再培训，而要调整考核、审查材料、追踪投诉并明确责任。",trap:"创新不等于绕开监管；文化建设也不是替代法律制度。",q:"怎样判断一家机构把行业文化落实到了日常经营？",a:"看治理、激励、流程、销售、客户保护和问责是否与价值观一致，观察实际行为和整改结果，而不是只看口号。",map:["价值观","诚信、义利、稳健、守正、合规。","制度设计","治理、考核、产品、授权、培训和责任机制。","日常行为","销售、投资、信息使用、客户服务和风险处置。","文化结果","维护信任、保护投资者并促进长期稳健发展。"]}
]},
{name:"科目二",title:"证券投资基金基础知识",subtitle:"从资产与现金流，走到组合、交易和基金运营",chapters:[
{title:"证券投资基金概述",intro:"证券投资基金把投资者资金汇成组合来投资证券。先理解基金与股票、债券的差异，再认识一只基金从募集到清算的完整流程。",units:[["基金的基本关系","投资者买入份额，基金财产持有证券，管理人作投资决策，托管人和服务机构履行各自职责。基金投资者承担净值变化带来的风险。"],["基金的运作环节","募集、投资管理、托管、交易结算、登记、估值核算、信息披露、销售服务和清算彼此相连。任一环节的数据错误都可能影响投资者权益。"],["基金的特点","集合投资带来分散化和专业管理，但分散不等于无风险。基金的流动性、费用、信息披露和法律关系要看具体类型与合同。"],["发展与市场","基金业经历制度和产品演进，投资范围、投资者结构和服务技术持续变化；理解发展脉络有助于区分传统产品与新类型。"]],example:"一只股票基金拥有多只股票。某公司股票下跌会影响基金净值，但影响大小取决于持仓比例及其他资产的表现。",trap:"买基金不是存款，基金净值不承诺固定；基金管理人也不等于基金资产所有者。",q:"基金份额持有人最终承担什么？管理人主要做什么？",a:"持有人按份额享有基金权益并承担投资风险；管理人依基金合同开展投资管理和运作。",map:["投资者","认购或申购基金份额，承担相应投资风险。","基金财产","按法律和基金合同与管理人自有财产区分。","管理与服务","管理人决策；托管、登记、估值、交易结算提供支持。","净值与权益","资产价值和费用进入核算，形成份额净值及投资者权益。"]},
{title:"基金的类型",intro:"基金名称往往同时包含多个分类。要先问“按什么标准分”，再理解这只基金适合什么用途、承担什么风险。",units:[["按投资对象","股票基金、债券基金、货币市场基金、混合基金和基金中基金等，资产构成与主要风险来源不同。"],["按运作方式","开放式基金按规则办理申购赎回；封闭式基金在约定期限内份额相对固定，交易安排不同。开放式不等于随时无条件取款。"],["指数与主动管理","指数基金试图跟踪指数，主动基金由管理人依据策略选择资产。指数跟踪仍有跟踪误差，主动管理也不保证跑赢基准。"],["特殊类型","QDII涉及境外投资，公募REITs投资基础设施相关资产并按规则运作。识别名称后要进一步看合同、投资范围和风险揭示。"]],example:"一只开放式债券指数基金：开放式描述申赎安排，债券描述投资对象，指数描述管理方法。这三个标签回答不同问题。",trap:"不能把股票/债券分类和开放/封闭分类当成互斥选项。",q:"如何解读“开放式债券指数基金”这几个词？",a:"开放式说运作和申赎；债券说主要投资资产；指数说投资管理目标或方式。",map:["分类维度","投资对象、募集方式、运作方式、投资策略分别回答不同问题。","底层资产","股票、债券、货币工具、其他基金或基础设施相关资产。","管理方式","主动选择或跟踪指数，决定决策和偏差来源。","投资体验","流动性、费用、波动和风险取决于多维度组合。"]},
{title:"投资管理基础",intro:"投资决策离不开财务报表、时间价值和数据。先读懂企业提供的数字，再判断这些数字怎样转化为价值和风险。",units:[["三张报表","资产负债表看某一时点拥有什么、欠什么；利润表看一段期间的收入和费用；现金流量表看现金从哪里来、流到哪里去。利润不等于现金。"],["报表分析","用偿债、盈利、运营效率和成长指标观察企业。杜邦分析把净资产收益率拆成利润率、资产周转率和权益乘数，帮助追问回报来自哪里。"],["货币时间价值","今天的一元钱可以投资生息，因此通常比未来的一元更有价值。终值 FV=PV×(1+r)^n；折现现值 PV=FV/(1+r)^n。"],["统计描述","均值描述中心水平，方差和标准差描述离散程度；相关性描述变量共同变化程度。历史数据只能帮助分析，不保证未来重复。"]],example:"企业账面盈利但客户尚未付款，现金流可能不足。分析偿债能力时只看利润表就会漏掉现金回收和债务到期问题。",trap:"名义利率未扣通胀，实际购买力要看实际利率；相关性不是因果关系。",q:"利润、现金流和资产负债表各回答什么问题？",a:"利润表看期间经营成果；现金流量表看现金收支；资产负债表看特定时点的资产、负债和权益。",map:["报表输入","资产负债表、利润表、现金流量表。","指标变换","比率和杜邦分解帮助比较偿债、盈利、效率与杠杆。","时间换算","复利推终值，折现把未来现金流换算为现值。","统计判断","用均值、波动和相关性描述数据，但不把历史关系误作保证。"]},
{title:"权益投资",intro:"权益代表对企业的剩余索取权。理解股东权利、公司融资结构和估值方法，才能看懂股票价格背后的企业假设。",units:[["股本与资本结构","企业用债务和权益融资。债权人通常先于股东获得合同约定的偿付，普通股股东分享剩余收益并承担较高的不确定性。"],["普通股与优先股","普通股通常有表决和剩余索取权；优先股在分红或清算顺序上可能有优先安排，具体权利以发行文件和法律为准。"],["股票估值","相对估值用可比企业的市盈率、市净率或市销率等倍数估算；现金流折现法把未来现金流按风险折到今天。方法不同，依赖假设也不同。"],["估值不是精确答案","估值结果受增长、利润率、资本成本、可比样本和市场情绪影响。分析要说清假设，并用区间与敏感性分析呈现不确定性。"]],example:"两家机器人公司收入倍数不同，可能因为增长、毛利、订单质量、现金消耗或技术风险不同。不能仅因行业相同就照搬估值。",trap:"股价是市场成交价格，内在价值是基于假设的估算；两者可能不一致。",q:"DCF估值最关键的两类输入是什么？",a:"未来可归属投资者的现金流预测，以及反映时间价值和风险的折现率；预测期、终值等假设也会显著影响结果。",map:["企业融资","债务和权益构成资本来源，权利与风险不同。","股东权益","享有剩余利益，普通股、优先股条款可能不同。","估值输入","盈利、现金流、增长、风险、可比公司和资本成本。","估值输出","倍数法或折现法形成估值区间，再与市场价格和交易条件比较。"]},
{title:"固定收益投资",intro:"债券像一张有期限和现金流约定的借条。投资者要判断发行人能否偿付、利率变化如何影响价格，以及债券何时能变现。",units:[["债券和市…9790 tokens truncated…径，不能把回购条款当成确定回款。",
"被投企业经营失败并进入清算。清算人先依法处理资产与债务，只有清偿后剩余财产才可能分给股东，基金再依自身合同向投资者分配。"
],example:"基金持有企业股份，企业计划上市但目前股份受限售承诺约束。管理人需要比较上市后减持、第三方转让、并购或合同回购等路径，并核对每条路径的审批、期限、交易价格和交割条件，再把实际回款纳入基金分配。",trap:"项目退出、投资者转让基金份额、基金整体清算是三个不同层次；IPO、上市和卖出股份也不是同一步骤。回购承诺不等于保本，挂牌也不等于交易所上市。",q:"项目退出、企业上市和投资者退出基金有什么区别？",a:"项目退出是基金变现被投企业权益；企业上市是企业股票获得相应市场的挂牌交易资格；投资者退出基金是投资者转让或处置其基金份额。三个环节的主体、对象和规则不同。",map:[
"退出对象","卖出被投企业权益，回款进入基金财产；不要与基金份额转让或基金清算混淆。",
"退出选择","比较上市、挂牌、第三方转让、并购、回购和清算的时间、价格、限制及可执行性。",
"境内外市场","区分沪深及北交所不同板块、境外市场和全国股转系统挂牌的定位与规则。",
"境内IPO","规范治理与核查 → 申报审核或注册 → 发行承销 → 挂牌交易。",
"境外上市","辨认直接或间接架构，核对境内外监管、备案、披露、外汇与税务要求。",
"上市后减持","先看股份来源、限售承诺、股东身份和减持规则，再安排出售与信息披露。",
"挂牌转让","主办券商推荐 → 申请审核 → 挂牌披露 → 按系统规则转让股份。",
"第三方转让与并购","核对受让方与交易价格 → 审批和优先权 → 签约交割 → 股权登记。",
"回购","确认触发条件和义务人 → 评估履约能力 → 执行合同与支付安排。",
"清算","确认清算事由 → 处置资产并通知债权人 → 清偿债务 → 分配剩余财产。"
]},
{title:"股权投资基金治理",intro:"基金治理回答谁作决定、谁监督、投资者怎样获得信息以及利益冲突如何处理。好的治理减少单方控制和信息不对称。",units:[["治理主体","投资者、管理人、GP、投委会、托管人和咨询委员会可能承担不同职责。具体权力来源于法律、组织形式和基金文件。"],["治理原则","利益一致、公平对待投资者、专业审慎、信息透明，并适当考虑其他利益相关者。原则需要通过制度和流程落地。"],["决策与授权","设置投资决策、关联交易、利益冲突、估值、重大事项和清算机制，明确谁提议、谁审批、谁执行、谁复核。"],["公平与透明","同一基金投资者应按适用文件和规则获得公平待遇；重大信息应及时按约定披露，不能选择性偏袒特定投资者。"]],example:"管理人拟与关联方交易，应识别关联关系、评估公平性、履行审批和披露程序，并保留依据，不能仅因“项目不错”跳过治理流程。",trap:"投委会通过不自动替代合同约定的投资者同意、监管审批或交割条件。",q:"基金治理为什么要关注公平对待和信息透明？",a:"投资者通常不直接管理项目，公平机制减少利益冲突，透明信息帮助投资者监督并理解基金风险。",map:["权利边界","合同、法律与组织形式决定各方权限。","决策机制","投委会、投资者会议和重大事项审批。","冲突管理","关联交易、基金间分配和利益冲突审查。","监督与披露","托管、审计、信息报告、投诉与问责。"]},
{title:"股权投资基金的运营管理",intro:"基金运作不止投资和退出。账户、估值、现金流、税务、收益分配、信息报告和争议解决共同支撑基金全生命周期。",units:[["账户、登记与托管","登记记录投资者权益和出资变化；托管按约履行财产保管、账户及监督职责。具体托管要求依基金类型和规则判断。"],["估值与绩效指标","IRR考虑现金流时点；DPI=累计已分配金额÷累计实缴资本；RVPI反映未退出投资相对实缴资本的剩余价值；TVPI=DPI+RVPI。指标要结合基金阶段解读。"],["收益分配","先按合同处理费用、返还出资、优先收益和业绩报酬等顺序。瀑布分配条款需明确计算口径、门槛、追补和回拨机制。"],["清算、披露与争议","基金到期或触发解散后进行资产处置、债务清偿和剩余财产分配。持续报告、税务处理及争议解决方式依合同和现行规则执行。"]],example:"基金只退出了部分项目，DPI可能较低而RVPI仍较高；TVPI把已分配和估算剩余价值合并。未退出估值不是现金回款。",trap:"IRR会受现金流时间影响，倍数指标不体现时间；DPI、RVPI、TVPI也不能单独评价投资质量。",q:"DPI、RVPI、TVPI分别反映什么？",a:"DPI反映已经分配回来的金额相对于实缴资本；RVPI反映尚未退出资产的估值；TVPI通常为DPI与RVPI之和，代表已实现与未实现价值合计。",map:["运营底座","账户、登记、托管、财务记录和合规流程。","估值与表现","IRR看时间加权现金流，DPI/RVPI/TVPI区分已实现与未实现。","分配与税务","按合同水位、顺序、税务主体和所得类型计算。","退出清算","报告、解决争议、清偿债务并分配剩余财产。"]}
]}
];
COURSES[2].chapters[3].units[0][1]="按现行规则，合格投资者须有相应风险识别和承担能力，投资单只基金通常不低于100万元；机构净资产一般不低于1000万元；个人金融资产一般不低于300万元，或最近三年个人年均收入不低于50万元。法律还规定若干视同合格的投资者类别。适用例外、产品类型和规则变化需以现行正式规定为准。";

const TERMS=[
["货币","货币是被普遍接受的支付和计价工具，也可用于储藏价值。把钱存下、借出或用于投资，会进入不同的金融关系。","你用 100 元买日用品是在支付；把暂时不用的钱存入银行，则把资金交给金融体系安排。"],
["资金","在金融学习里，资金通常指可以用于消费、生产、借贷或投资的货币资源。资金会从暂时有余的一方流向当前需要的一方。","家庭有暂时闲置的储蓄，企业有扩建厂房的资金需求，两者之间可以通过金融体系建立联系。"],
["金融市场","资金供给方与需求方通过金融工具融通资金、形成交易价格并管理风险的一套场所、规则和关系。它既包括交易场所，也包括场外交易和支撑交易的制度。","企业发行债券筹钱，投资者买入债券；之后投资者之间还可以转让债券。"],
["直接融资","资金需求者通过发行股票、债券等金融工具，直接向投资者取得资金；金融中介仍可能提供承销、交易等服务。","公司发行债券，投资者认购，募集资金按约定进入公司。"],
["间接融资","资金通过银行等金融中介在供给方和需求方之间转移。中介先吸收存款或其他资金，再按规则向借款人提供资金。","储户把钱存入银行，企业向银行贷款；储户通常不直接成为企业的债权人。"],
["金融工具","金融工具是约定权利和义务、可以形成金融交易的合同或凭证，例如存款、贷款、股票、债券和基金份额。","债券写明谁借款、何时付息还本；股票代表股东权益，权利结构不同。"],
["金融资产","金融资产是持有人拥有的现金、金融工具或由合同形成的收款等权利。某项资产对一方是金融资产，对另一方常对应负债或权益。","你持有的债券是金融资产；发行债券的企业则承担按约偿付的义务。"],
["证券","证券是证明或设定财产权利等权益的凭证。股票和债券是常见证券，但证券并不等于所有金融工具。","银行存款属于金融关系和金融资产，但日常所说的证券通常指股票、债券等可交易凭证。"],
["股票","股票是公司发行的权益凭证，持有人依法和依公司章程享有相应股东权利，并承担股价波动等风险。股票不承诺固定还本或收益。","公司盈利和市场预期变化可能影响股价；股东也可能通过分红获得回报，但分红并非固定保证。"],
["债券","债券是发行人按约定向债券持有人偿还本金、支付利息或其他约定现金流的债务凭证。回报能否兑现取决于条款和发行人的偿付能力。","你借钱给企业并取得债券，企业按合同付息还本；如果信用变差，债券价格可能下跌。"],
["一级市场","一级市场是金融工具发行、募集资金的环节，发行人或基金在这里向投资者募集资金。","企业首次发行股票募集资金，资金进入发行人；基金募集成立也属于发行募集过程。"],
["二级市场","二级市场是已发行金融工具在投资者之间转让交易的市场。通常买卖双方互换持有者，交易款不直接成为发行人的新增融资。","投资者在交易所买入另一位投资者卖出的股票，成交价由市场交易形成。"],
["基金","基金是一种按规则汇集或受托管理财产、并依约进行投资的安排或产品。基金产品、基金管理公司和投资者持有的基金份额是不同概念。","买入基金份额后，你持有的是基金合同约定的权利，不是基金管理公司股权。"],
["基金财产","基金财产是依法律和基金合同归集、独立核算并用于基金运作的财产。它与管理人、托管人等机构的自有财产相区分。","基金持有的股票和银行存款属于该基金财产，不是管理公司可以拿去支付自身开支的钱。"],
["基金份额","基金份额是投资者持有基金权益的凭证，具体权利、费用和运作方式由法律及基金文件规定。份额数量不等于固定金额，价值会随基金资产变化。","你持有 100 份基金，单位净值从 1 元变为 1.05 元时，份额对应的资产价值也随之变化，费用等因素另计。"],
["基金净值","基金净值是基金资产扣除负债后的价值。单位净值通常等于基金净资产除以基金份额总数，是了解每份基金账面价值的重要指标。","如果基金净资产为 100 万元、总份额为 100 万份，简化计算的单位净值为每份 1 元。"],
["资产管理","资产管理是受托机构按约定替客户或基金管理财产、作出投资安排并承担相应职责的服务。专业管理不等于保证本金或收益。","投资者把钱投入基金，由管理人按照基金合同投资；盈亏仍会反映到基金财产和份额价值。"],
["基金管理人","基金管理人按照法律和基金文件募集、投资运作和管理基金，并承担相应受托职责。它负责投资管理，不等同于基金财产所有人。","管理人决定基金组合如何投资；投资决策应符合产品文件和适用规则。"],
["基金托管人","基金托管人依法律和基金文件履行基金财产保管、账户、核算或监督等职责。托管职责与管理人的投资决策职责不同。","托管人按规定保管、核对基金财产；通常不替管理人挑选股票。"],
["投资者","投资者是提供资金、购买或持有金融产品并承担相应投资结果的人或机构。投资者享有产品文件和法律规定的权利，也需要了解风险。","基金投资者可以查阅规定披露的信息、按约定申赎，也要承担基金净值波动。"],
["公募与私募","公募和私募主要描述募集方式及适用的规则框架。公募面向公众公开募集；私募以非公开方式向符合要求的投资者募集，不能公开宣传招揽。","同样投资股票的两只基金，募集对象和披露要求可能不同，不能只凭投资方向判断规则。"],
["开放式与封闭式","这是基金运作和份额申赎安排的分类。开放式基金通常按约定开放日办理申购、赎回；封闭式基金在约定期限内通常不办理日常申赎，份额可能通过市场交易。","开放式基金可能按合同每日开放；封闭式基金的投资者若要提前退出，可能需要在交易市场转让份额。"],
["申购","申购是投资者按基金规则申请买入基金份额的行为。受理申请、确认份额和资金到账有不同时间点，实际以产品文件及业务规则为准。","今天提交申购申请，不一定按提交瞬间的净值确认；要看申请时间、确认日和费用规则。"],
["赎回","赎回是投资者按基金规则申请卖回或注销所持基金份额并取得相应款项的行为。到账时间、费用、开放安排和限制以产品文件为准。","提交赎回后，通常还要经过确认和结算，到账金额会受到净值和费用影响。"],
["收益与风险","收益是投资带来的收入或价值变化；风险表示结果存在不确定性及可能损失。通常不能只看预期收益而忽略发生损失的可能与幅度。","两只产品预期收益相近，波动、流动性和本金损失可能性不同，不能据收益数字单独判断。"],
["流动性","流动性描述资产能否较快地以接近合理价值转换为现金，或产品能否按约定满足支付需求。流动性强弱会随市场环境变化。","交易活跃的股票通常较易出售；未上市公司的股权可能要等待多年才能退出。"],
["分散投资","分散投资是把资金配置到多个资产、行业或风险来源中，降低单一因素造成的影响；它不能消除整体市场风险，也不能保证盈利。","持有多家不同行业公司的股票，通常比只持有一家更不容易被单一公司事件左右。"],
["利率","利率是借用资金的价格，也用于把未来现金流换算成今天价值。市场利率变化会影响借款成本、债券估值和其他资产价格。","市场利率上升时，旧有固定票息债券相对吸引力可能下降，其价格通常承压。"],
["估值","估值是依据资产、现金流、可比交易或其他方法，对价值作出的判断。估值结果取决于方法、假设和信息，不一定等于实际可成交价格。","未上市公司股权的账面估值可能很高，但真正退出时仍要看买方、交易条件和市场环境。"],
["LP","Limited Partner，有限合伙人。其权利义务由法律和合伙协议确定，通常以认缴出资额为限承担合伙企业债务责任。","LP通常是基金的出资方之一，按协议缴资、获取信息并分享投资结果，不负责日常执行全部事务。"],
["GP","General Partner，普通合伙人。在有限合伙基金中通常负责执行合伙事务；其责任和权限依法律及合伙协议确定。GP是合伙人身份，不等于基金产品本身。","一个机构可以担任某只基金的 GP，但这家机构与基金及基金财产仍是不同主体。"],
["投前/投后估值","投前估值是本轮新资金进入前对企业股权价值的约定或测算；投后估值是本轮投资后口径。简化情形下，投后估值=投前估值+本轮新增投资。","投前 900 万元、本轮投资 100 万元，简化投后估值为 1000 万元；新投资人对应比例约 10%，复杂条款会改变结果。"],
["DD","Due Diligence，尽职调查。投资方在决策前核查企业或交易的商业、财务、法律、税务、技术和团队等情况，识别问题与风险。","看中一家初创企业后，投资团队会核验收入数据、知识产权、合同、债务和核心人员情况。"],
["IC","Investment Committee，投资委员会。机构按内部治理和授权制度，由委员会审议投资、退出或其他重要事项。具体权限因机构制度而异。","尽调完成后，投资团队可能向 IC 汇报交易逻辑、估值、风险和拟定条件。"],
["IPO","Initial Public Offering，首次公开发行股票。发行是公司向公众发行股票的过程；股票上市是其后在交易场所挂牌交易的环节，两者相关但不是同一概念。","公司完成 IPO 并上市后，原股东股份的减持仍可能受锁定期和现行规则约束。"],
["IRR","Internal Rate of Return，内部收益率。它是让一组按时间发生的投资现金流净现值等于零的折现率，金额和回款时间都会影响结果。IRR不是实际年年赚到的收益率。","同样收回 2 倍本金，较早收到回款的项目 IRR 通常高于较晚收到回款的项目。"],
["DPI","Distributed to Paid-In，累计已分配金额除以累计实缴资本，侧重衡量已经返还给投资人的现金。","累计实缴 100 万元、累计分配 60 万元，DPI 为 0.6 倍；剩余未退出估值不计入分子。"],
["RVPI","Residual Value to Paid-In，未退出投资的剩余估值除以累计实缴资本。它依赖估值，尚未变现，不等同于已收到的钱。","累计实缴 100 万元、未退出项目估值 40 万元，RVPI 为 0.4 倍；估值可能上调或下调。"],
["TVPI","Total Value to Paid-In，总价值倍数，通常等于 DPI 加 RVPI，合计已分配金额和未退出投资的估值，再与累计实缴资本比较。","DPI 为 0.6 倍、RVPI 为 0.4 倍时，TVPI 为 1.0 倍；这不表示投资人已收回全部现金。"],
["久期","久期是衡量债券价格对利率变化敏感程度的工具之一，修正久期常用于估算小幅利率变化造成的价格百分比变化。久期不等同于债券剩余期限。","修正久期约 5 的债券，收益率上升 1 个百分点时，价格粗略可能下跌约 5%；实际还受凸性等影响。"],
["适当性","适当性要求经营机构了解客户、产品或服务的风险，并按规定进行匹配、告知和风险揭示。它帮助投资者理解是否适合，不代表产品没有风险。","面对风险承受能力较低的客户，销售人员应核实其情况并按要求提示产品风险，不能只追求成交。"],
["交割条件","交割条件是交易正式付款、股权转让或资产交付前必须满足的事项，具体由交易文件和适用规则约定。","股权投资协议可能约定完成审批、提交证明文件后，投资款才支付、股权才办理变更。"],
["返投","返投常指政府投资基金等依政策、基金文件或协议约定，在特定地域或产业形成一定投资带动的安排。具体比例、统计口径和认定方式要看现行文件。","一只地方引导基金可能约定部分资金投向当地企业，但要按协议口径核实，不能把它理解成企业自动获得补贴。"],
["四上企业","统计工作中对规模以上工业企业、有资质建筑业企业、限额以上批零住餐企业和规模以上服务业企业等类别的统称。入库标准按行业和当期统计制度判断。","企业是否属于“四上”统计类别与它是否是基金、是否获得投资是两回事，也不代表自动取得补贴资格。"]
];
const FORMULAS=[
["货币时间价值","FV=PV×(1+r)^n","PV是今天的金额，r是每期利率，n是期数。100元按年利率5%复利两年，FV=110.25元。"],
["折现现值","PV=FV÷(1+r)^n","把未来现金流换算到今天。期限越长或折现率越高，其他条件相同时现值越低。"],
["债券定价","P=Σ[CF_t÷(1+y)^t]","债券价格是未来票息和本金按市场收益率折现后的总和。市场收益率上升，旧债价格通常下跌。"],
["债券当期收益率","当期收益率=年票息÷债券当前价格","例如年票息5元、价格98元，当期收益率约5.10%；它不含到期偿还与价格变化的完整收益。"],
["修正久期近似","ΔP/P≈−D_mod×Δy","收益率上升通常使债券价格下跌。利率变动较大时还要考虑凸性，估算不等于精确成交价。"],
["CAPM","E(R_i)=R_f+β_i×[E(R_m)−R_f]","预期收益由无风险利率加上承担系统性市场风险所对应的风险溢价构成；它是模型，不是保证收益。"],
["β","β_i=Cov(R_i,R_m)÷Var(R_m)","β衡量资产收益对市场收益变化的历史敏感程度。数据期间和市场代理选择会影响估计。"],
["夏普比率","Sharpe=(R_p−R_f)÷σ_p","单位总波动对应的超额收益；比较时应统一期间、无风险利率和收益频率。"],
["最大回撤","回撤_t=(净值_t÷此前最高净值)−1","区间最大回撤取回撤序列的最低值，表示从前高跌到后续低点的最大幅度。"],
["基金单位净值","单位净值=(基金资产总值−基金负债)÷基金份额总数","申购赎回的份额或金额以适用确认日净值和合同费率计算。"],
["简化申购份额","净申购金额=申购金额−申购费用；份额=净申购金额÷确认净值","不同产品可能采用不同费率和金额口径；这张卡说明基础关系，不替代具体产品公式。"],
["时间加权收益","TWR=Π(1+r_i)−1","把外部现金流发生时段切开并连乘，尽量剔除投资者申赎时点对管理业绩的影响。"],
["年化复合收益","年化收益=(1+期间收益)^(1/年数)−1","必须说明观察期间；把很短期间年化会放大不确定性。"],
["IRR","Σ[CF_t÷(1+IRR)^t]=0","让一组投资现金流净现值为零的折现率。现金流时点与金额都会影响IRR。"],
["DPI / RVPI / TVPI","DPI=累计已分配÷累计实缴；RVPI=剩余估值÷累计实缴；TVPI=DPI+RVPI","DPI是已回款，RVPI是未退出估值，TVPI合计两者；未实现估值不是现金。"],
["投前与投后估值","投后估值=投前估值+新增投资；新股比例≈投资额÷投后估值","只适用于简化无其他股本调整的情形。条款、期权池、可转证券和多轮交割会改变结果。"]
];
function blankStudyState(){return{course:0,chapter:0,tab:"home",seen:{},donePoints:{},quizAnswers:{},studyRecords:[],reviewDates:{},studiedOn:{},dailyPlans:{}}}
let state=blankStudyState();try{state=Object.assign(state,JSON.parse(localStorage.getItem("fund-study-course-v2")||"{}"))}catch(e){}
function persistLocalState(){try{localStorage.setItem("fund-study-course-v2",JSON.stringify(state))}catch(e){}}
function save(){persistLocalState()}
function setSyncBadge(text){const el=document.getElementById("syncBadge");if(el)el.textContent=text}

function normalizeState(){
 const toIndex=(v,max,fallback)=>{const n=Number(v);return Number.isInteger(n)?Math.max(0,Math.min(max,n)):fallback};
 state.course=toIndex(state.course,COURSES.length-1,0);
 state.chapter=toIndex(state.chapter,COURSES[state.course].chapters.length-1,0);
 state.tab=["home","course","map","refs"].includes(state.tab)?state.tab:"course";
 state.seen=state.seen&&typeof state.seen==="object"?state.seen:{};
 state.donePoints=state.donePoints&&typeof state.donePoints==="object"?state.donePoints:{};
 state.quizAnswers=state.quizAnswers&&typeof state.quizAnswers==="object"?state.quizAnswers:{};
 state.studyRecords=Array.isArray(state.studyRecords)?state.studyRecords:[];
 state.reviewDates=state.reviewDates&&typeof state.reviewDates==="object"?state.reviewDates:{};
 state.studiedOn=state.studiedOn&&typeof state.studiedOn==="object"?state.studiedOn:{};
 state.dailyPlans=state.dailyPlans&&typeof state.dailyPlans==="object"?state.dailyPlans:{};
 state.point=Number.isInteger(state.point)&&state.point>=0&&state.point<current().units.length?state.point:null;
}
function chinaDate(){
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const v={};p.forEach(x=>{if(x.type!=="literal")v[x.type]=x.value});return v.year+"-"+v.month+"-"+v.day;
}
function shiftDate(date,days){const p=date.split("-").map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]+days));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function pointFromKey(key){const p=key.split(":").map(Number);if(p.length!==3||!COURSES[p[0]]||!COURSES[p[0]].chapters[p[1]]||!COURSES[p[0]].chapters[p[1]].units[p[2]])return null;return{key,course:p[0],chapter:p[1],point:p[2]}}
function ensureTodayPlan(){
 const today=chinaDate();if(Array.isArray(state.dailyPlans[today]))return state.dailyPlans[today];
 const studied=state.studiedOn[today]||{},items=[];
 Object.keys(state.reviewDates).filter(k=>state.reviewDates[k]<=today&&!studied[k]&&state.donePoints[k]).sort((a,b)=>state.reviewDates[a].localeCompare(state.reviewDates[b])).slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}));
 outer:for(let ci=0;ci<COURSES.length;ci++)for(let hi=0;hi<COURSES[ci].chapters.length;hi++)for(let pi=0;pi<COURSES[ci].chapters[hi].units.length;pi++){const k=pointKey(ci,hi,pi);if(!state.donePoints[k]&&!items.some(x=>x.key===k)){items.push({key:k,kind:"新学"});if(items.length>=3)break outer}}
 if(items.length===0){const upcoming=Object.keys(state.reviewDates).filter(k=>!studied[k]&&state.donePoints[k]).sort((a,b)=>state.reviewDates[a].localeCompare(state.reviewDates[b]));upcoming.slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}));if(items.length===0)Object.keys(state.donePoints).filter(k=>state.donePoints[k]).slice(0,2).forEach(k=>items.push({key:k,kind:"复习"}))}
 state.dailyPlans[today]=items;
 const dates=Object.keys(state.dailyPlans).sort();dates.slice(0,Math.max(0,dates.length-60)).forEach(d=>delete state.dailyPlans[d]);

function startPlanItem(key,kind){
 const p=pointFromKey(key);if(!p)return;

function todayRecords(){const d=chinaDate();return state.studyRecords.filter(x=>x.date===d)}
function learningSuggestion(){
 const records=todayRecords(),wrong=records.filter(x=>!x.correct).length,plan=ensureTodayPlan(),studied=state.studiedOn[chinaDate()]||{},done=plan.filter(x=>studied[x.key]).length;
 if(!records.length)return"先从今天的复习项开始，再学新知识点。建议分两次完成，约 15–20 分钟。";
 if(wrong>=2&&wrong>=records.length/2)return"今天有几题需要再巩固。明天的计划会优先安排这些知识点，先重读含义，再重做选择题。";

}
function recentStudyCount(){const cutoff=shiftDate(chinaDate(),-6),seen={};state.studyRecords.forEach(x=>{if(x.date>=cutoff)seen[x.date+":"+x.key]=true});return Object.keys(seen).length}
function dailyPlanView(){
 const today=chinaDate(),plan=ensureTodayPlan(),studied=state.studiedOn[today]||{},done=plan.filter(x=>studied[x.key]).length,records=todayRecords(),right=records.filter(x=>x.correct).length;
 const rows=plan.map((item,i)=>{const p=pointFromKey(item.key);if(!p)return"";const c=COURSES[p.course],chapter=c.chapters[p.chapter],u=chapter.units[p.point],complete=!!studied[item.key];return '<div class="plan-row"><span class="plan-number">'+String(i+1).padStart(2,"0")+'</span><div class="plan-copy"><span class="plan-kind">'+item.kind+'</span><b>'+esc(u[0])+'</b><small>'+esc(c.name)+' · '+esc(chapter.title)+'</small></div><button type="button" class="'+(complete?"secondary":"primary")+'" onclick="startPlanItem(&quot;'+item.key+'&quot;,&quot;'+item.kind+'&quot;)">'+(complete?"再看":"开始")+'</button></div>'}).join("");

 return '<section class="daily-plan"><div class="daily-head"><div><div class="eyebrow">今日学习计划 · '+today+'</div><h3>今天学 '+plan.length+' 个知识点，约 15–20 分钟</h3></div><div class="daily-total">'+done+' / '+plan.length+'</div></div><div class="chapter-status"><span>今日计划进度</span><span>'+done+' / '+plan.length+' 项</span></div><div class="progressline large"><span style="width:'+(plan.length?Math.round(done/plan.length*100):0)+'%"></span></div><div class="plan-list">'+(rows||'<p class="smallnote">今天的计划已完成。系统会在到期时安排复习。</p>')+'</div><div class="daily-advice"><b>学习建议</b><p>'+learningSuggestion()+'</p><small>今天答题 '+records.length+' 次 · 正确 '+right+' 次 · 近 7 天学过 '+recentStudyCount()+' 个知识点</small></div><div class="recent-history"><b>最近学习记录</b>'+(history?'<div class="history-list">'+history+'</div>':'<p class="smallnote">完成一次知识点选择题后，学习记录会显示在这里。</p>')+'</div></section>';

function pointKey(ci,hi,pi){return ci+":"+hi+":"+pi}
function chapterStats(ci,hi){const units=COURSES[ci].chapters[hi].units||[],done=units.filter((_,pi)=>state.donePoints[pointKey(ci,hi,pi)]).length;return{done,total:units.length,pct:units.length?Math.round(done/units.length*100):0}}
function subjectStats(ci){let done=0,total=0,chaptersDone=0;COURSES[ci].chapters.forEach((_,hi)=>{const s=chapterStats(ci,hi);done+=s.done;total+=s.total;if(s.total&&s.done===s.total)chaptersDone++});return{done,total,chaptersDone,chapters:COURSES[ci].chapters.length,pct:total?Math.round(done/total*100):0}}

function renderSide(){

}
function filterChapters(){
 const q=document.getElementById("search").value.trim().toLowerCase(),results=document.getElementById("searchResults"),courseLabel=document.getElementById("courseLabel"),chapterLabel=document.getElementById("chapterLabel"),courses=document.getElementById("courses"),chapters=document.getElementById("chapters");
 if(!q){results.classList.add("hide");results.innerHTML="";courseLabel.classList.remove("hide");chapterLabel.classList.remove("hide");courses.classList.remove("hide");chapters.classList.remove("hide");return}
 courseLabel.classList.add("hide");chapterLabel.classList.add("hide");courses.classList.add("hide");chapters.classList.add("hide");results.classList.remove("hide");
 const hits=[];
 COURSES.forEach((course,ci)=>course.chapters.forEach((chapter,hi)=>{
  const chapterBody=[course.name,course.title,chapter.title,chapter.intro,chapter.example,chapter.trap,chapter.q,chapter.a,...(chapter.map||[])].join(" ").toLowerCase();
  if(chapterBody.includes(q))hits.push({title:chapter.title,meta:course.name+" · 第 "+(hi+1)+" 章",action:"jumpSearchChapter("+ci+","+hi+")"});
  (chapter.units||[]).forEach((u,pi)=>{const map=(chapter.map||[]).slice(pi*2,pi*2+2).join(" ");if([u[0],u[1],chapter.scenes&&chapter.scenes[pi],map].join(" ").toLowerCase().includes(q))hits.push({title:u[0],meta:course.name+" · "+chapter.title+" · 知识点",action:"jumpSearchPoint("+ci+","+hi+","+pi+")"})});
 }));
 TERMS.forEach((t,i)=>{if(t.join(" ").toLowerCase().includes(q))hits.push({title:t[0],meta:"术语解释",action:"jumpSearchTerm("+i+")"})});
 FORMULAS.forEach((f,i)=>{if(f.join(" ").toLowerCase().includes(q))hits.push({title:f[0],meta:"计算入门卡",action:"jumpSearchFormula("+i+")"})});

function quizOptions(c,pi){

function answerPoint(optionIndex){
 if(state.point===null)return;const key=pointKey(state.course,state.chapter,state.point);if(state.quizAnswers[key]!==undefined)return;

function importProgress(input){

function pointView(){
 const c=current(),course=COURSES[state.course],i=state.point,u=c.units[i],s=chapterStats(state.course,state.chapter),key=pointKey(state.course,state.chapter,i),options=quizOptions(c,i),chosen=state.quizAnswers[key],pairs=mapPairs(c),branch=pairs[i]||[u[0],u[1]],scene=c.scenes&&c.scenes[i]?c.scenes[i]:c.example,answered=chosen!==undefined,correct=answered&&options[chosen]&&options[chosen].correct;

 const nodes=units.map((u,i)=>{const p=pairs[i]||[u[0],u[1]];return '<article class="map-point"><h3>'+esc(u[0])+'</h3><p>'+esc(u[1])+'</p><div class="map-children"><b>'+esc(p[0])+'</b><br>'+esc(p[1])+'</div><button type="button" class="map-link" onclick="openPoint('+i+')">打开这个知识点 →</button></article>'}).join("");

</script></body></html>
